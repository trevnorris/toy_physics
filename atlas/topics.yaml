topics:
  - slug: foundations
    title: "Foundations: superfluid medium, bulk arena, and throat defects"
    track: Foundations
    summary: The model starts with a declared bulk superfluid arena, finite brane-bulk throat defects, and a parent action that fixes the fields used downstream.
    status: published_backed
    node_ids:
      - PHYS_SUPERFLUID_MEDIUM
      - PHYS_BULK_ARENA
      - PHYS_BRANE_BULK_THROAT_DEFECT
      - PHYS_INTERIOR_SUPPORT
      - MATH_PARENT_ACTION_CURRENT
      - CLAIM_PARENT_ACTION_CURRENT_EXACT
      - EQ_PARENT_ACTION_CURRENT
      - EQ_GNLS_BULK
    sections:
      physical_picture:
        - This page fixes the base vocabulary used by the rest of the research reader. The later PN, electromagnetic, particle-sector, and moving-throat pages all depend on the same distinction between declared parent objects, projected observables, and reduced effective descriptions.
        - The bulk is the ambient 4+1 arena carrying the superfluid or GNLS medium. The brane is the observed sector inside that arena, not a separate closed universe. A brane observer therefore sees projected quantities and boundary data rather than the entire bulk state.
        - A particle-like object is modeled as a finite brane-bulk throat defect. In the atlas language that means an open conduit or puncture through the brane with interior support structure, not a small surface dent and not a capped pocket. The finite radius matters because later response channels can couple to mouth shape, wall support, and outgoing-port data.
        - The interior support region is where later moving-throat work adds wall, BdG, Maxwell/mixed, and outgoing response degrees of freedom. Those additions are downstream of the parent vocabulary; they should not be retroactively treated as claims already frozen into the earliest 4D parent paper.
        - The practical reading rule is to start with physical objects before reading coefficient matches. A PN equality, charge reduction, or anomaly corridor is only meaningful once the page says which parent object, projection, closure, or branch export supplied it.
      mathematical_core:
        - The current parent action is the declared GNLS matter sector plus localized Maxwell sector, with geometry entering through the confinement data. The graph records this as the current parent action, not as the later promoted moving-wall action.
        - The bulk matter equation is the gauged GNLS equation obtained from that parent stack. It carries the wavefunction, density, equation-of-state, and confinement dependence used by downstream reductions.
        - The reader-facing invariant is provenance. Every later result should be traceable back to a parent object, a projection map, a controlled reduction, a closure hierarchy, or an actual branch computation.
        - This is why the site keeps source anchors and graph IDs visible below the prose. They are not meant to be the first reading layer, but they make the research claims auditable when a page compresses several papers into one topic.
      status_note:
        - The parent-action and brane-observer parts of this page are paper-backed by the 4D model and related field-sector papers. Some finite-throat and interior-support language is currently notes-backed or inherited from the moving-throat program, so the page deliberately marks those sources as paper pending.
        - Future papers can add sharper throat dynamics, wall laws, or branch exporters, but they should be added as later developments. The public site should not rewrite the frozen parent paper into saying more than it originally established.
        - "When this topic is cited from another page, the safe summary is: exact declared parent stack first; projection and reduction second; moving-throat branch dynamics only where a later source supports it."
    related_topics:
      - projection-open-brane
      - charge-em
      - moving-throat-pde

  - slug: projection-open-brane
    title: "Projection versus reduction: why the brane is an open subsystem"
    track: Foundations
    summary: Projection defines what a brane observer measures; reduction is an extra controlled dynamical simplification and cannot be silently identified with projection.
    status: published_backed
    node_ids:
      - CLAIM_PROJECTION_OPEN_BRANE_SYSTEM
      - CLAIM_ZERO_MODE_MAXWELL_REDUCTION
      - MATH_W_PROJECTION
      - PHYS_BRANE_OBSERVER
      - PHYS_REG_OBSERVER_PROJECTION
      - EQ_PROJECTED_CONTINUITY
      - EQ_LONGITUDINAL_IDENTITY
      - FIREWALL_PROJECTION_NOT_REDUCTION
      - NEG_QUERY_PROJECTION_EQUALS_REDUCTION
    sections:
      physical_picture:
        - This page explains the first operation after the parent model is declared. A brane observer does not inspect the entire bulk field configuration; the observer accesses a weighted projection across the transverse direction.
        - Because the observation is projected, the brane sector is open. Bulk support, leakage, boundary data, and interior throat structure can enter the projected balance laws even when the full parent continuity law remains conservative.
        - Reduction is a different operation. A reduced 3+1 law is obtained only after imposing extra assumptions such as zero-mode behavior, far-field limits, axial simplifications, or a chosen localization regime.
        - This distinction is why later response packets must be described carefully. A packet is exported or measured branch data; it is not automatically a new physical throat object and it is not automatically a closed brane-only law.
        - "The reader should carry this rule forward: projection says what the brane observer measures, while reduction says what dynamical simplification has been adopted for a particular calculation."
      mathematical_core:
        - The projection kernel W(w) is an exact measurement definition. For a bulk quantity Q, the brane observable is a W-weighted quantity, and that operation is distinct from any localization profile appearing in an action.
        - Projecting the parent continuity law produces an exact brane balance with a leakage/source term. That leakage term is not an error; it is the mathematical sign that the brane is an open subsystem of the bulk arena.
        - The longitudinal identity contains the Poisson-hook Laplacian, but it becomes the familiar Poisson-like reading only in a controlled quasi-static and longitudinal regime.
        - Zero-mode Maxwell is therefore a controlled reduction, not the definition of projection itself. Mixed core channels may be suppressed in that limit, but they have not been erased from the parent theory.
        - "Public explanations should preserve this order: parent fields first, projection second, controlled reduction third, downstream claims last."
      status_note:
        - This topic is paper-backed by the 4D parent, Maxwell, and plasma papers. Some downstream moving-throat uses of the projection language remain notes-backed, so those appear in the paper-pending source list.
        - The graph contains an explicit firewall blocking the invalid shortcut "projection equals reduction." Public pages should keep that warning visible because it prevents several later overclaims.
        - "Safe summary: W(w) defines observed brane quantities exactly; any closed 3+1 effective law requires additional reduction assumptions."
    related_topics:
      - foundations
      - charge-em
      - status-firewalls

  - slug: charge-em
    title: Electromagnetism and charge bookkeeping
    track: Fields
    summary: The electromagnetic sector has a controlled zero-mode Maxwell limit, but charge sign and coupling bookkeeping are not derived from throat circulation or geometry alone.
    status: published_backed
    node_ids:
      - PHYS_LOCALIZED_EM_SECTOR
      - PHYS_CHARGE_BRANCH
      - PHYS_MAGNETIC_VORTICAL_CIRCULATION
      - MATH_LOCALIZED_MAXWELL_AM
      - MATH_ZERO_MODE_MAXWELL
      - MATH_Z_PROFILE
      - EQ_ZERO_MODE_MAXWELL
      - EQ_QEFF_NORMALIZATION
      - CLAIM_ZERO_MODE_MAXWELL_REDUCTION
      - CLAIM_CHARGE_ONTOLOGY_FIREWALL
      - PHYS_MIXED_EM_CORE
      - FIREWALL_CHARGE_NOT_CIRCULATION
      - FIREWALL_QEFF_THICKNESS_NOT_BREATHING
      - FIREWALL_KAPPARHO_NOT_CHARGE
    sections:
      physical_picture:
        - The electromagnetic sector is not introduced as an isolated 3+1 Maxwell theory. It starts as a localized 4+1 gauge field with a transverse localization profile, then admits an ordinary brane Maxwell reading only after a controlled zero-mode reduction.
        - That split matters for charge. Electric sign is carried by an oriented charge branch label, while the observed brane coupling is dressed by localization. The public page should therefore distinguish the microscopic branch charge, the effective brane charge, and any magnetic or vortical circulation data.
        - Magnetic or vortical circulation can be real structure in the model without being the definition of electric charge sign. Treating circulation as charge would collapse two different physical sectors and would corrupt later atom, lepton, and response-packet claims.
        - The mixed brane-bulk EM core is also retained in the parent theory. In a strict zero-mode brane reduction those channels are suppressed, but the research reader should not present them as nonexistent.
      mathematical_core:
        - The localized Maxwell sector uses a localization profile Z(w). Its integral controls the effective brane coupling, which is why the same parent charge branch can appear with a dressed brane strength after canonical normalization.
        - "The zero-mode Maxwell equation is the safe public reduction: under axial, zero-mode, and far-field assumptions it gives an effective 3+1 Maxwell law with a localization-dressed coupling."
        - The charge-normalization equation records the bookkeeping rule. The microscopic branch charge q_star and the observed q_eff are related by the localization integral, while eta_Q carries the electric sign label.
        - Beyond the zero-mode limit, mixed and transverse components such as A_w, J^w, and F_{mu w} must be tracked rather than erased. Those channels are exactly why this topic links forward to the moving-throat and response-packet pages.
        - The graph carries separate firewalls for charge sign, q_eff/q_star bookkeeping, and kappa_rho notation because each blocks a different tempting shortcut.
      status_note:
        - This topic is mostly paper-backed by the 4D parent, Maxwell, and plasma papers. The mixed-sector moving-throat plumbing is still partly notes-backed and should remain visible as paper pending.
        - "Safe summary: brane Maxwell is a controlled zero-mode reduction; electric charge sign is eta_Q; observed charge strength is localization-dressed; magnetic/vortical circulation is not electric charge."
    related_topics:
      - projection-open-brane
      - moving-throat-pde
      - status-firewalls

  - slug: pn-ladder
    title: "Post-Newtonian ladder: 1PN through 4PN"
    track: PN Chain
    summary: The published PN chain records exact 1PN, 2PN, and 3PN assemblies within declared closures, while 4PN is local/conditional because the inherited tail normalization remains open.
    status: published_backed
    node_ids:
      - CLAIM_1PN_EIH_WITHIN_HIERARCHY
      - EQ_1PN_EIH_EQUALITY
      - CLAIM_2PN_ADM_WITHIN_HIERARCHY
      - EQ_2PN_ADM_EQUALITY
      - CLAIM_25PN_QUAD_NARROWING
      - CLAIM_3PN_GROUPED_P2_WITHIN_HIERARCHY
      - EQ_3PN_SPLIT
      - CLAIM_4PN_LOCAL_CLOSED_TAIL_CONDITIONAL
      - EQ_4PN_TAIL_BRIDGE
      - FIREWALL_25PN_CONDITIONAL
      - FIREWALL_4PN_LOCAL_NOT_FULL_TAIL
    sections:
      physical_picture:
        - This page is the research reader's map of the published PN chain. It should be read as a sequence of increasingly strict matching claims, not as one undifferentiated declaration that every physical branch has been solved.
        - The 1PN and 2PN conservative sectors are full assembly results inside their declared closure hierarchy. They show that the effective two-body dynamics can reproduce the standard EIH and ADM targets once the earlier dictionary and closure data are supplied.
        - The 2.5PN result changes the problem. It is dissipative rather than conservative, and it narrows the live route to the orbital or worldtube STF quadrupole channel while leaving the passive/outgoing normalization as branch data still to be supplied.
        - The 3PN conservative result inherits that structure. It closes the conservative assembly in a fixed ADM chart while making the grouped real P2 payload visible as the next microscopic moving-throat target.
        - The 4PN local sector is assembled, but the hereditary tail coefficient points back to the same quadrupole-normalization gate exposed at 2.5PN. That is the reason the page says local/conditional rather than unconditional full 4PN closure.
        - "This framing helps readers avoid an overclaim: a local algebraic match is not always the same as a solved physical branch."
      mathematical_core:
        - The key public math is the equality of the model's effective two-body Lagrangian or Hamiltonian with standard PN targets at each controlled stage.
        - At 1PN the displayed equality is the direct EIH match. At 2PN the Legendre-transformed Hamiltonian matches the ADM target. At 3PN the fixed-chart conservative split separates the kinetic image, grouped P2 middle block, and geometry completion.
        - "The 2.5PN bridge should be understood as a status transition rather than just another rung: it demotes scalar and dipole dangers, isolates the STF quadrupole route, and leaves an explicit normalization gate."
        - The 4PN tail bridge is therefore not a new independent fit. Its coefficient is inherited from the same outgoing quadrupole normalization that appears on the 2.5PN page.
        - The dedicated quadrupole page carries the normalization equation and open gate details; this page carries the reading order and status logic for the PN chain.
      status_note:
        - The 1PN, 2PN, and 3PN conservative claims are paper-backed exact assemblies within their stated hierarchies. The 2.5PN and 4PN statements are also paper-backed, but their status is conditional because they expose or inherit the same branch-normalization requirement.
        - The frozen papers should remain fixed. If later work closes the outgoing quadrupole gate, the website should add a later-development section and update the graph status rather than rewrite the original PN status.
        - "Safe summary: lower conservative rungs close within declared closures; dissipative and hereditary rungs depend on target-blind branch export of the quadrupole normalization."
    related_topics:
      - quadrupole-radiation
      - response-packets
      - status-firewalls

  - slug: quadrupole-radiation
    title: Quadrupole radiation and the 2.5PN normalization gate
    track: PN Chain
    summary: The 2.5PN sector narrows the dissipative problem to an outgoing quadrupole normalization target, but the actual branch data must still supply the normalization.
    status: mixed_published_and_open
    node_ids:
      - CLAIM_25PN_QUAD_NARROWING
      - CLAIM_PROJECTED_EM_OUTGOING_BRIDGE
      - CLAIM_STAGE022_P0_TARGET
      - CLAIM_STAGE024_O3_ISOTROPY
      - PN_2_5_QUAD_NARROWING
      - PHYS_OUTGOING_QUADRUPOLE_PORT
      - MATH_STF_SOURCE_MAP
      - EQ_COMPACT_L2_FINGERPRINT
      - EQ_P0_TARGET
      - OPEN_QUAD_NORMALIZATION
      - OPEN_SOURCE_PORT_NORMALIZATION
      - FIREWALL_25PN_CONDITIONAL
      - FIREWALL_ANGULAR_NOT_RADIAL
    sections:
      physical_picture:
        - This page is the gate between the published PN ladder and the still-active moving-throat branch program. It explains why the 2.5PN result is a strong narrowing theorem but not yet an unconditional solved-branch theorem.
        - The scalar and dipole danger channels are demoted on the natural branch, leaving the orbital or worldtube STF quadrupole as the surviving universal dissipative route.
        - The current PDE ledger gets to this outgoing port through the projection-first electromagnetic packet in Stages 004--020, then uses the retained Stage 021 reduced one-port adapter before the grouped normalization bridge.
        - The outgoing quadrupole port is the physical place where the branch must speak. It must export the passive outgoing response with the correct normalization before the 2.5PN and inherited 4PN tail statements can be upgraded.
        - "The angular source-map result is real progress: the canonical STF angular basis maps into the grouped P2 ports cleanly. But angular closure is only the angular part of the problem."
        - The remaining issue is radial, axial, and port-amplitude data. The same branch must provide the source scale and outgoing prefactor as branch data, not as a coefficient fitted after comparing with the PN target.
      mathematical_core:
        - The compact outgoing l=2 fingerprint fixes the universal low-frequency structure of the outgoing quadrupole response. Its imaginary omega^5 term is the bridge into the dissipative 2.5PN coefficient.
        - In the reordered ledger, that fingerprint is anchored after projected EM by the Stage 021 one-port adapter, while Stage 022 records the grouped P2 normalization bridge.
        - The central target is an invariant product involving the source scale and outgoing response coefficient. The graph records it as EQ_P0_TARGET and protects it with open-gate status.
        - In reduced grouped-P2 language, the leading odd coefficient depends on the isotropic static outgoing prefactor. The branch must therefore deliver P0 or the equivalent N0/D0 readout through the response-packet machinery.
        - The STF source-map theorem and O(3) angular isotropy organize the basis and remove angular ambiguity. They do not compute the radial selected branch, the axial normalization, or the outgoing port amplitude.
        - Exact angular source-map facts should not be upgraded into radial or axial normalization closure. That is why the angular-not-radial firewall belongs on the public page.
      status_note:
        - Published papers describe the conditional narrowing and the inherited 4PN tail dependence. The PDE ledger supplies useful stage evidence, but some supporting branch-export details remain paper pending.
        - Future work should add a closure paper or executable branch computation rather than mutate this status. When the gate closes, the graph should show target-blind branch data that lands on the normalization before target comparison.
        - "Safe summary: the quadrupole route is isolated; the angular basis is controlled; the outgoing normalization is still an open branch-output gate."
    related_topics:
      - pn-ladder
      - response-packets
      - moving-throat-pde

  - slug: moving-throat-pde
    title: Moving-throat PDE program
    track: Moving Throat
    summary: The moving-throat program studies wall/support dynamics, branch selection, and response export, but some parts are currently notes-backed rather than formal paper-backed.
    status: notes_backed_pending_papers
    node_ids:
      - MATH_WALL_ACTION_S_ETA
      - MATH_WALL_MODAL_PDE
      - EQ_WALL_MODAL_PDE
      - CLAIM_PARENT_WALL_STATUS_SPLIT
      - CLAIM_PROJECTED_EM_OUTGOING_BRIDGE
      - MT_STAGE004_020_PROJECTED_MAXWELL
      - MT_STAGE021_REDUCED_ONE_PORT
      - CLAIM_STAGE025_031_SELECTED_BRANCH
      - MATH_PARENT_ACTION_PROMOTED
      - OPEN_PARENT_PROMOTION_S_SIGMA
      - OPEN_NONLINEAR_S_SIGMA
      - PHYS_BRANCH_EXPORTER
      - PHYS_TARGET_BLIND_BRANCH_SELECTION
      - PHYS_RESPONSE_READOUTS
      - OPEN_ACTUAL_BRANCH_EXPORTER
      - OPEN_EXECUTABLE_BRANCH_SOLVER
      - OPEN_MATERIAL_CLOSURE
      - OPEN_MIXED_RECIRCULATION
      - FIREWALL_PARENT_WALL_NOT_STRICT
      - FIREWALL_WALL_COEFFS_BRANCH_DATA
      - FILE_PDE_AUDIT
    sections:
      physical_picture:
        - This is the active bridge from a static or reduced throat picture to an executable physical branch. It asks which wall variables, material laws, mixed-sector plumbing, and boundary packets the same branch must export.
        - A moving throat is not just a geometric label. It needs support variables, constitutive coefficients, boundary data, material closure, and a branch solver that can be run before any comparison to PN or anomaly targets.
        - The present status is split. The effective wall modal equation is valid when the wall action is included, but the confinement-only parent action does not by itself prove autonomous moving-wall dynamics.
        - The branch exporter is the central missing object. It must solve and freeze a physical branch first, then export response packets for PN or anomaly comparison without reading the target.
        - This is where quadrupole normalization becomes an executable problem rather than a target equation. The same branch has to supply the radial, axial, outgoing, and material data used downstream.
      mathematical_core:
        - The quadratic wall action S_eta^(2) generates the effective scalar and P2 wall equations. It is a controlled linear wall closure, not yet a strict parent-level nonlinear wall theory.
        - Strict parent-level status requires the promoted S_Sigma action. Its quadratic limit should reproduce the effective wall closure, but the nonlinear completion remains an open gate.
        - "The electromagnetic block now follows the projection-first ledger ordering: Stages 004--020 derive the projected Maxwell packet, and Stage 021 keeps the reduced one-port normal form only as the downstream adapter."
        - The selected-mode stages convert radial and axial branch data into a spectral reachability packet for the remaining normalization targets.
        - The branch exporter should output quantities such as K, M, B_n, Z_n, N_n, P0, N2, and N4 as frozen data from the solved branch, not as adjustable fit knobs.
        - Material closure and mixed recirculation have to close on the same branch. Density, sound speed, effective light cone, intake/output flux, A_w, F_muw, and current-source plumbing cannot be solved as detached post-processing.
      status_note:
        - This page is intentionally notes-backed and paper-pending. It should point readers to the current audited program while making clear that the formal moving-throat paper is still future work.
        - Do not read the wall PDE as already parent-exact. It is exact relative to an action containing the wall term, and strict parent status depends on the promoted wall/support sector.
        - Keep wall coefficients as branch or constitutive data. They are not post-hoc parameters to rescue a target comparison.
        - Once the PDE paper or maintained ledger components are published, the source links can be backfilled without rewriting the earlier status boundaries.
    related_topics:
      - response-packets
      - quadrupole-radiation
      - future-paper-worklist

  - slug: response-packets
    title: Branch response packets and target-blind export
    track: Moving Throat
    summary: The model needs branch data exported before comparison to PN or anomaly targets; response packets must be target-blind and downstream of the physical branch.
    status: notes_backed_pending_papers
    node_ids:
      - CLAIM_BRANCH_EXPORTER_REQUIRED
      - CLAIM_PACKET_A_PACKET_B_SPLIT
      - CLAIM_RESPONSE_READOUT_DISCIPLINE
      - PHYS_BRANCH_EXPORTER
      - PHYS_TARGET_BLIND_BRANCH_SELECTION
      - PHYS_RESPONSE_READOUTS
      - READOUT_D0_C_P0_N2_N4
      - MATH_WEAK_FORM_BRANCH_EXTRACTOR
      - EQ_FULL_BUNDLE_TARGET_SURFACE
      - EQ_P0_TARGET
      - EQ_XI1_PREF_SLOPE
      - MT_V2_20_WEAK_FORM_EXTRACTOR
      - OPEN_ACTUAL_BRANCH_EXPORTER
      - OPEN_EXECUTABLE_BRANCH_SOLVER
      - TARGET_PACKET_A
      - TARGET_PACKET_B
      - OPEN_N2_N4_MOMENT_SHAPE
      - OPEN_WEAK_AXISYM_ORBIT_LOCK
      - FIREWALL_READOUTS_NOT_THROAT
    sections:
      physical_picture:
        - A response packet is the output contract between a solved moving-throat branch and a downstream PN, anomaly, or continuation comparison.
        - The packet is not a physical object in its own right. It is compressed readout data downstream of the throat mouth, interior support, mixed sector, outgoing port, and material closure.
        - Packet A carries the conservative and outgoing grouped target data. It is where K, M, B_n, Z_n, N_n, D0, C, P0, N2, and N4 become branch-exported quantities rather than fitted comparison constants.
        - Packet B carries orbit-lock and weak-axisymmetric data when that tangent is relevant, especially for the 5PN continuation and g-2 style common quotient language.
        - The target-blind rule is the whole point. The branch must be selected, solved, frozen, and exported before the target surface is evaluated.
      mathematical_core:
        - The weak-form branch extractor is the planned interface between solved profiles and invariant packet data. It prepares Galerkin or weak-form extraction of response moments, grouped projectors, residuals, and stability gates.
        - Packet A includes the one-pole and full-bundle target surface, plus the P0 quadrupole normalization inherited from the 2.5PN and 4PN tail story.
        - Packet B includes the weak-axisymmetric prefactor slope and orbit-lock tangent. It should be read as a branch-output condition, not as evidence that the actual weak-axisymmetric branch has already been solved.
        - The open exporter decomposes into an executable branch solver, source and port normalization, N2/N4 outgoing moment-shape control, and weak-axisymmetric orbit-lock where needed.
        - The readout firewall matters because D0, C, P0, N2, and N4 are audit coordinates. They summarize projected branch behavior, but they do not replace the physical throat or support system.
      status_note:
        - This page is still notes-backed. The equations on it are useful target surfaces and readout definitions, but the actual target-blind physical branch exporter remains open.
        - Treat Packet A and Packet B as future-paper interfaces until the moving-throat branch solver exports them from a frozen branch.
        - Once a formal branch-export paper exists, update the graph sources first; the generated backfill list will then show which pending note citations can be replaced.
    related_topics:
      - moving-throat-pde
      - quadrupole-radiation
      - five-pn-continuation

  - slug: five-pn-continuation
    title: 5PN continuation and full-bundle surface
    track: PN Chain
    summary: The 5PN continuation organizes full-bundle targets, monomial quotients, and weak-axisymmetric transport, but it is presently a future-paper area.
    status: notes_backed_pending_papers
    node_ids:
      - CLAIM_5PN_FULL_BUNDLE_SURFACE
      - CLAIM_PACKET_A_PACKET_B_SPLIT
      - CLAIM_G2_COMMON_QUOTIENT
      - PHYS_RESPONSE_READOUTS
      - PHYS_FINITE_MOUTH_SHAPE
      - PN_5_FULL_BUNDLE_SURFACE
      - EQ_FULL_BUNDLE_TARGET_SURFACE
