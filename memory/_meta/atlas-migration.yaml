inventory_date: "2026-08-24"
repository_snapshot: 30e96ee22245d4a7d0e873ad228cf5ce33de76f0

# This file is a deletion gate for atlas/ and graph/. It is not a physics-status
# register. Legacy statuses are recorded only to identify the old artifact; all
# migrated wording and status must be re-extracted from the cited tracked source
# lineage, with newer sources taking precedence under memory/_meta/schema.md.
policy:
  eligible_reanchors:
    - research
    - software
  excluded_as_semantic_sources:
    - notes
    - docs
    - research/pde_ledger
    - research/pde_ledger_v2
    - research/pde_ledger_v3
  dispositions:
    migrate: Preserve the useful knowledge in the proposed memory target after re-reading original sources.
    covered_by_source: Do not copy the Atlas representation; the selected source capsule or topic synthesis will recover it.
    generated_duplicate: Do not migrate; it is a generated view or a duplicate of another inventoried item.
    obsolete: Do not migrate; it is Atlas maintenance state, excluded notes-only material, or a stale status snapshot.
  status_rule: Never copy an Atlas status as current; resolve it from the cited research/software lineage.
  unanchored_rule: Items with reanchor_complete false cannot enter semantic memory until an eligible source is found.
  excluded_source_rule: A record whose only eligible reanchor is under an excluded source root is obsolete, not covered_by_source.

