schema_version: 2
status: phase0_complete
extractor_contract_version: 1

discovery:
  committed_tree_only: true
  candidate_roots: [research, software]
  excluded_repository_roots: [notes, docs]
  legacy_migration_roots: [atlas, graph]
  report_dirty_tracked_files: true
  include_untracked: false

read_limits:
  semantic_member_max_bytes: 2000000
  semantic_unit_max_bytes: 8000000
  derived_task_max_bytes: 750000
  excerpt_context_bytes: 8192
  identity_only_above_limit: false

output_budgets:
  source_capsule: {max_words: 1800, max_key_statements: 12}
  topic: {max_words: 1000, max_key_statements: 8}
  script_catalog: {max_words: 2500, max_entries: 10, max_entry_words: 250}
  conflict_register: {max_words: 1800, max_entries: 5, max_entry_words: 350}
  index: {max_words: 700}

# These are defaults for tree discovery. An exact member in a configured unit
# may override a semantic exclusion when that process artifact is load-bearing.
semantic_excludes:
  prefixes:
    - research/pde_ledger/redteam/
    - research/pde_ledger/redteam_adversarial/
  path_segments:
    - .git
    - __pycache__
    - .pytest_cache
    - _scratch
  basename_suffixes:
    - _prompt.md
  suffixes:
    - .pdf

binary_suffixes:
  - .gif
  - .h5
  - .hdf5
  - .npy
  - .npz
  - .vtk
  - .vtu
  - .vtr
  - .vti
  - .pvtu
  - .pvd
  - .xdmf
  - .bp
  - .pkl
  - .pickle
  - .pt
  - .pth
  - .ckpt
  - .safetensors
  - .mat
  - .nc
  - .parquet
  - .feather

selector_contract:
  allowed_keys:
    - prefix
    - recursive
    - suffixes
    - basenames
    - name_prefixes
    - exclude_paths
    - exclude_prefixes
    - role
    - read_mode
    - ownership
    - required
  path_matching: case_sensitive_posix_segments

canonical_lineages:
  - id: moving-throat-pde-program
    retrieval_order:
      - pde-ledger-v3-governance
      - pde-ledger-v3-paper
      - paper-moving-throat-pde
      - pde-audit
      - pde-ledger-v2
      - pde-ledger-archive
    basis: configured_retrieval_lineage_only
    note: This chooses navigation order; it does not declare whole-source scientific supersession.

  - id: stage1-status
    retrieval_order:
      - stage1-verdict
      - stage1-solver
    basis: explicit_section_level_revision
    note: STAGE1_VERDICT supersedes only the README build-status claims; README architecture and commands remain current.

