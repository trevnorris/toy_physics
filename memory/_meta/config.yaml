  - id: pde-ledger-v3-s10
    kind: step_family
    source_role: current_step_record
    capsule: memory/sources/pde-ledger-v3-s10.md
    lifecycle: current
    editorial_focus:
      - >-
        Preserve that every preregistered prediction was reported as holding; later controls narrow the headline interpretation and generality of exact transversality, not the factual FULLGRAD longitudinal-polarization prediction.
      - >-
        Preserve the three scoped history records from the interpretive step record: declared-name coverage superseded by mechanical matching with D12 injectivity still open; historical Q7 before/after counts unreproducible because the old harness is absent; and the old reduction registry absent with a distributed live replacement plus its historical provenance defect.
      - >-
        State the comparator's negative coverage explicitly: no shared action-payload name, all 13 Euler-Lagrange rows fail representational comparison, all 13 route-account rows fail token-content comparison, and underlying route constructions are not compared; the two routes remain a coding-consistency control.
      - >-
        Preserve open physical assumptions about equilibrium of the unstrained state, stable stiffness sign, possible internal-angular-momentum or couple-stress requirements for a curl-only continuum, and admissibility of the rotational-stiffness preferred-orientation frame.
      - >-
        Preserve both unresolved substrate-delivery gates: the curl-only functional is supplied rather than derived from the substrate, and the substrate still owes the joint quadratic operator on in-plane u and out-of-plane h, including whether h couples to or is degenerate with the transverse pair; failure can change the headline mode count.
      - >-
        Preserve the S9-to-S10 export-chain guard and the MAIN dimensional-homogeneity result as conditional status boundaries, including the guard's known blind spots.
      - >-
        Keep the conditional MAIN spectrum, longitudinal zero-mode, control-boundary, and MAIN dimensional results provisional unless the sealed transaction supplies a recorded invocation; do not label those four results derived merely because a transcript reports them.
      - >-
        Use the available 12-statement budget for these load-bearing boundaries before secondary numerical detail.
    selectors:
      - {prefix: research/pde_ledger_v3/steps, recursive: false, name_prefixes: [S10], suffixes: [.md], role: step_record, read_mode: semantic, ownership: primary, required: true}
    members:
      - {path: research/pde_ledger_v3/paper/steps/S10_two_transverse_photons.tex, role: paper_card, read_mode: semantic, required: true}
      - {path: research/pde_ledger_v3/scripts/S10_brane_mode_spectrum_sympy_audit.py, role: engine, read_mode: semantic, required: true}
