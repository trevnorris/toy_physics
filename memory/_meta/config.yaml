        anchors: [PY_S10_MAIN_D2_Q3_ROOT_COUNT, PY_S10_XFORM_ANISO_D3_Q3_ROOT_COUNT, PY_S10_XCOEF_SCALE_D3_Q3_ROOT_COUNT]
        required: true
      - path: research/pde_ledger_v3/scripts/out/S10_cross_engine_comparator.out
