  - id: paper-unified-4d
    kind: paper
    source_role: canonical_paper
    capsule: memory/sources/papers/unified-4d.md
    lifecycle: current
    editorial_focus:
      - Preserve the projection-versus-dimensional-reduction firewall with sec:braneobs and sec:emreduction.
      - Preserve that total charge is independent of a, L, Gamma, and continuous throat breathing; distinguish it from localization-controlled effective coupling and vortical circulation.
      - Split declared charge ontology from derived vorticity/fluxoid identities, retaining the away-from-singularities and closed-loop assumptions.
      - Split the derived geometry force ledger from adopted phenomenological inertias, damping, energy choices, and damped closure.
      - State that the proposal is exploratory, symbolic checks address internal consistency only, and external subject-matter validation remains outstanding.
      - Retain one compact action-result statement for the GNLS, localized Maxwell equation, and bulk continuity identity.
      - Treat projection versus reduction as a provisional declared firewall, cite sec:braneobs and sec:emreduction exactly, and move leakage or stress claims to their own anchored statements.
      - State Poisson assumptions as sufficient regime conditions; longitudinal dominance is optional/common, not necessary.
      - Scope fluxoid quantization to a closed brane loop encircling the defect mouth in a region where psi is single-valued.
      - "Use the exact unnumbered heading line \\section*{Acknowledgments} for the external-review status; do not use anchor-unavailable."
      - Put every computed-evidence, open-work, and revision judgment in its own status-and-sources statement block.
      - "Preserve correction and extension language without declaring formal supersession: cite action-em, discussion-explains, geometry-Egeom, and geometry-dynamics as applicable."
      - Count the Purpose statement in the 12-statement whole-page ceiling; if one result must be omitted, omit the secondary projected-momentum-stress statement before any retrieval surface listed above.
      - Keep the derived Purpose/action statement free of the exploratory-status adjective; record exploratory status only in the open-work block anchored by the exact Acknowledgments heading.
      - If the projection firewall mentions the absence of boundary matching, cite sec:intro in that block; otherwise omit that clause.
      - If the charge-ontology block distinguishes charge from circulation, cite sec:eom-winding or eq:circulation-fluxoid in that block.
      - In the revision block, do not say the Poisson/leakage discussion clarifies earlier phenomenology unless sec:conclusion is cited; the simpler preferred wording omits "earlier phenomenology."
      - For limitations and outlook, the only permitted section labels are sec:discussion-limitations and sec:discussion-outlook; do not shorten or rename them.
      - "In the Purpose/action statement, use this attribution exactly: variation yields the GNLS and localized Maxwell equations; global U(1) phase invariance yields the exact bulk continuity identity. Do not attribute continuity to variation."
      - "In the Maxwell zero-mode statement, retain the N=w consistency condition: the total w-directed current J_psi^w + J_ext^w must be negligible or suppressed under the pure zero-mode ansatz. Compatible nu-source profiling is an additional condition, not a replacement."
    members:
      - {path: research/4d/paper/4d.tex, role: primary, read_mode: semantic, required: true}

