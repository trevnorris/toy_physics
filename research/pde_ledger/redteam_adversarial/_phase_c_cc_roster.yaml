batch_id: cc_internal_consistency_completeness_critic
# ---------------------------------------------------------------------------
# Internal-consistency completeness-critic spot-check (the ONLY remaining
# Phase-C step; the free_choice sweep, batches 1-7, is COMPLETE).
#
# DESIGN. ~685 internal_consistency candidates are honest in-ledger derivations
# already covered by layer-1 red-team x2; they are NOT all re-audited. This pass
# SAMPLES + TARGETS the overclaim-flavored internal_consistency SLUGS, per the
# execution-plan RESUME directive. The completeness critic ran its OWN
# whole-ledger slug sweep (NOT just the in-band seeds noticed during batches
# 6/7): /tmp/enum_ic_overclaim.py -> 84 Tier-A bundles (strong posit-as-derived
# slug signal: forced/fixed_exactly/backsolve/injection/not_free/_req/...,
# spanning stages 6-253) and 135 Tier-B bundles (weaker/structural words:
# exact/closure/canonical/derived/carried/fixed). The curated seed list in
# STEP6_CLOSEOUT_PUNCHLIST.md is a SUBSET of these (in-band only).
#
# THE INVERTED TEST. Unlike the free_choice sweep (where the value is a CHOICE
# and the flaw is dressing it as derived), here the value is CLASSIFIED as a
# DERIVATION (constraint_kind: internal_consistency). The fatal flaw hunted is
# the OPPOSITE mis-classification: a value that is genuinely a POSITED
# free_choice (an inserted number / tuned knob) OR a back-solve from an EXTERNAL
# published number, but mis-classified internal_consistency AND labeled
# derived/forced/exact in a card/notes line -- a posit-as-derived (or
# fit-as-derived) that ESCAPED the free_choice + published_target sweeps via
# mis-classification. NO = a genuine algebraic/closure/extremum/limit derivation
# exists upstream (the slug's "forced/exact" correctly names that consequence).
# YES = the value is actually inserted/back-solved and the derivation claim is
# false. The overclaim-flavored slug is the PROMPT to scrutinize, not evidence.
#
# RECONCILIATION (seed-list correction): the seed-list 247 lambda_L family
# (benchmark_pinned/backsolve/closure/fixed_by_recorded_point) and 248 Xi_turn
# are constraint_kind=published_target (NOT internal_consistency); canonical
# bundles already AUDITED in batch 1's published_target sweep (backsolve/closure
# variants are deduped aliases, <MISSING> from manifest). They are OUT OF SCOPE
# here -- already covered. Logged, not dropped.
#
# 085 zeta_req (unblocked_literal_law) already status=audited -> excluded.
# Tier-A deep-audit targets after exclusions: 83 bundles across 11 units.
# Tier-B (135) -> cross-family SAMPLE in u12 + population logged not-deep-audited.
# ---------------------------------------------------------------------------
