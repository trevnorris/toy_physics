    excerpt: 'The SymPy script (docstring lines 8-22) and the assertions verify: (I) normalized real-harmonic bookkeeping
      — `Y00=1/(2√π)`, unit norms, zero averages for the five real P2 modes, orthogonality `cross(Y00,Y20)=0`, the mouth-average
      extraction `q00=2√π δa`, and the spherical-Laplacian eigenvalue `−Δ_{S²}=l(l+1)` (i.e. `6` for l=2); (II) the confinement
      chain-rule sign `δV_conf=−(V''_wall(Σ0/ℓc)/ℓc)η` via a genuine ε-variation; (III) the modal wall Euler–Lagrange equation
      in both the densitized and weighted-surface conventions, the `K_l` restoring-shift specialization at l=0,2, and the
      sourced RHS; (IV) a representative two-component (x,w) localized-Maxwell linearization with the `Z(w)` weight, gauge-fixing
      term, and source current. The Mathematica `.wl` mirrors the same checks and adds an independent `SphericalHarmonicY`-based
      eigenvalue confirmation (I.3b) and uses `VariationalD` for the Maxwell sector. Every check is an `expect_zero`/`expectZero`
      against a hand-written target; the saved outputs show all residuals `= 0` and all `PASS`.'
