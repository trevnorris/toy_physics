  # ---------------------------------------------------------------------------
  # (2) GR mass-quadrupole radiation coefficient  (ledger gamma_GR = 2 G / (5 c^5))
  #     Quadrupole luminosity / radiation-reaction normalization: the famous 2/5,
  #     i.e. luminosity L = (G / 5 c^5) <dddQ_ij dddQ_ij> for the reduced (traceless)
  #     mass quadrupole; the circular-binary luminosity carries the 32/5 factor.
  # ---------------------------------------------------------------------------
  - family_id: fam_0187_p0_target
    claim: "Ledger back-solves P0_target to gamma_GR = 2 G / (5 c^5), the standard GR mass-quadrupole gravitational radiation-reaction / luminosity normalization (the dimensionless 2/5; quadrupole luminosity coefficient G/(5 c^5))."
    value: "Quadrupole gravitational-wave luminosity L = dE/dt = (G / 5 c^5) < d^3 Q_ij/dt^3 . d^3 Q_ij/dt^3 > using the reduced (traceless) mass quadrupole Q_ij. Coefficient = G/(5 c^5); equivalently G/(45 c^5) when written with the non-reduced quadrupole. Circular-binary luminosity carries 32/5: L = (32/5)(G/c^5) mu^2 a^4 omega^6. The radiation-reaction normalization is the 2/5 factor."
    source_type: textbook
    source_citation: "P. C. Peters, 'Gravitational Radiation and the Motion of Two Point Masses', Phys. Rev. 136, B1224 (1964), DOI 10.1103/PhysRev.136.B1224 (ADS bibcode 1964PhRv..136.1224P); see also M. Maggiore, 'Gravitational Waves, Vol. 1: Theory and Experiments', Oxford Univ. Press (2007), ISBN 978-0-19-857074-5, Ch. 3 (quadrupole formula L = (G/5c^5)<dddQ_ij dddQ_ij>)."
    obtained_note: "WebSearch on 2026-06-11 (queries on the quadrupole luminosity formula and Maggiore Vol.1) returned the explicit formula L_GW = (1/5)(G/c^5)<d^3 Q_ij/dt^3 d^3 Q_ij/dt^3> with the reduced/traceless quadrupole, confirming the G/(5 c^5) coefficient and hence the 2/5; the equivalent non-reduced form carries G/(45 c^5). The 32/5 circular-binary coefficient was confirmed via the Peters & Mathews search (P0 = (32/5 c^5)... for a circular orbit). The primary paper Peters 1964 Phys. Rev. 136, B1224 was confirmed by WebSearch (Semantic Scholar + NASA ADS 1964PhRv..136.1224P + OSTI 4688457) with DOI 10.1103/PhysRev.136.B1224; the APS full text (link.aps.org) returned HTTP 403 (paywall) so the coefficient itself was confirmed from the open lecture/textbook search extractions, not the paywalled APS page. AGREEMENT: the ledger's gamma_GR = 2G/(5c^5) uses exactly the standard 2/5 / G/(5c^5) quadrupole radiation-reaction normalization."

