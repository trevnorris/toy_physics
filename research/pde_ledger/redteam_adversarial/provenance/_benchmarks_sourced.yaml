  - family_id: fam_0458_m_s_ratio_1836
    claim: "Ledger imports 1836.15267343 (stage 250 proton-proxy benchmark) as a match to the CODATA proton-to-electron mass ratio m_p/m_e."
    value: "1836.152 673 43(11)  [2018 CODATA: standard uncertainty 0.000 000 11, relative u_r = 6.0e-11]. Current 2022 CODATA value: 1836.152 673 426(32), relative u_r = 1.7e-11."
    source_type: CODATA
    source_citation: "NIST CODATA, proton-electron mass ratio (m_p/m_e), https://physics.nist.gov/cgi-bin/cuu/Value?mpsme ; CODATA Internationally recommended values of the fundamental physical constants (2018 and 2022 adjustments)."
    obtained_note: "WebFetch of https://physics.nist.gov/cgi-bin/cuu/Value?mpsme on 2026-06-11 returned the current 2022 value 1836.152 673 426(32), u_r=1.7e-11. WebSearch (NIST/CODATA 2018 sources incl. physics.nist.gov/cuu/pdf/wallet_2018.pdf, all_2018.pdf) confirmed the 2018 value 1836.152 673 43(11), u=0.000 000 11, u_r=6.0e-11. AGREEMENT: the ledger's 1836.15267343 matches the 2018 CODATA value EXACTLY to all printed digits; it is the 2018 release (NOT 2014, NOT 2022). The 2022 value shifted to 1836.152 673 426(32), still consistent within uncertainty but with more digits, so the ledger number is specifically the 2018 CODATA recommended value."

