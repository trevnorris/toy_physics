key_rules:
- pattern: (?:^|_)sigma0_num(?:_|$)
  target: Sigma0_num
- pattern: (?:^|_)sigma0_can(?:_|$)
  target: Sigma0_can
- pattern: (?:^|_)sigma_0_can(?:_|$)
  target: Sigma_0_can
- pattern: fixedpoint_expected_targets_json
  target: Sigma0_can
  multi_target: true
- pattern: canonical_quartet_literals
  target: Sigma0_can
  multi_target: true
- pattern: canonical_mouth_block
  target: Sigma0_can
  multi_target: true
- pattern: (?:^|_)chi_?q(?:_|$)|chiq|chiQ
  target: chi_Q
- pattern: unit_product_m0hat2_chiQ_NQ
  target: chi_Q
  multi_target: true
- pattern: (?:^|_)m0hat|mhat0|mhat_0|m_hat_0
  target: mhat_0
- pattern: (?:^|_)nq(?:_|$)|nq_target|NQ_target
  target: N_Q
- pattern: (?:^|_)p0target|p0_target|p_0_target|universal_p0
  target: P0_target
- pattern: 54_5|54_over_5|quadrupole_normalization|normalization_target
  target: P0_target
- pattern: aspect_ratio|37_20|37_over_20
  target: L_over_a
- pattern: rexact_closed_form_4107|radical_constant_forced_by_rf1
  target: r_F1
- pattern: (?:^|_)lambda_l(?:_|$)|lambda_L
  target: lambda_L
- pattern: vknown|V_known|barrier_benchmark
  target: V_known
- pattern: wall_action_constitutive_coefficients
  target: K_eta
  multi_target: true
- pattern: calibration_slice|benchmark_masses|stage252_slice_inputs
  target: mu_eta
  multi_target: true
multi_target_key_patterns:
- block
- bundle
- calibration_slice
- canonical_quartet
- constants_block
- expected_targets
- inputs
- packet
- quintuple
- slice
