        ways (one-pole defect=0 and `P0=P0_target`) and matches each to its closed form (lines 49–52); checks the compatibility
        identity directly (line 56); derives the constant-prefactor `N2`/`N4` closures, a Jacobian-determinant identity, the
        `P2`/`P4` factorizations, and mutation guards that the factorizations are non-trivial (lines 58–101); factorizes the
        one-pole numerator in `M_Σ`, verifies Vieta sum/product and the `u2`-sign discrimination of the two roots, plus three
        numeric stable-pole samples (lines 103–173); and anchors `M_Σ`,`K_Σ` against concrete Gaussian wall integrals (`√π`,
        `3√π/2`, lines 176–185). The Mathematica script (M1–M12) re-derives `u2,u4,P0,P2,P4` independently via `Series` expansion
        of `1/den` and `D0(N0+N2 x+N4 x²)/den²` (lines 71–82) and checks the same identities.'
