        carried as a postulated ansatz, so that `δΛ_core` collapses to the compensated form; (6) a capstone wires booleans
        from sections 1-5 residuals and asserts the unique nontrivial survivor is the compensated Robin-mixed core realization.
        The script does NOT assert the microscopic realization (it prints the open question).'
