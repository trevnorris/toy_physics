        line is correct because `rho` is clamped to 0 beyond the cut (`[...]_+` in notes), so it equals the full-line integral
        of the clamped profile; (iv) the `25` coefficient and all reported decimals match the paper. The single finding (F1)
        is a real but non-load-bearing `symbol_assumption_error`: declaring the symmetric integration variable `xi` `positive=True`
        contradicts the setup (`xi_* < 0`, integral over `(-oo,oo)`) and disagrees with the Mathematica domain, but the explicit
        integral bounds neutralize it today. Verdict is `findings` (one low-severity script-side fix), not clean, and not
        stop_cold — fixing it cannot change any result.'
