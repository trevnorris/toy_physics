        = z d/dz ln h_2^(1)(z)`, whose static slot is `Lambda_2^out(0) = -3`, and whose small-z series (notes box, lines 28–38)
        is `-3 + z^2/3 + z^4/9 + i z^5/9 - 2 z^6/27 - i z^7/27 + O(z^8)`. Normalizing by the static slot gives the canonical
        outgoing quadrupole admittance (notes box, lines 54–65; card line 16; appendix eq. `Yout-dtn`): `\widehat Y_2^out(z)
        = 1 + z^2/9 + 4 z^4/81 + i z^5/27 - 11 z^6/729 - i z^7/243 + O(z^8)`. In ω-form (notes lines 72–81): `1 + a^2 omega^2/(9
        c_s^2) + 4 a^4 omega^4/(81 c_s^4) + i a^5 omega^5/(27 c_s^5) + O(omega^6)`. The headline consequence (notes "Consequence",
        line 89): the canonical odd quadrupole coefficient is fixed, `Gamma_{5,can}^DtN = a^5/(27 c_s^5)`. The card''s `Purpose`
        states "Its audit target is the verification output quoted below," and the quoted block is exactly the `\widehat Y_2^out`
        fingerprint. The `chi_Q=1` / `m̂_0^2 chi_Q N_Q = 1` framing in the card''s "Derivation ledger" and in appendix eq.
        `chiQ-equals-one` is the downstream comparison that USES this fingerprint (against the retarded one-pole form of an
        earlier stage); it is narrative, not this script''s own deliverable.'
