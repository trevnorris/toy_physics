        and conservative Family--1 wall-depth data" given by the two boxed equations: the natural shell-weighted datum `Theta_w^{(\chi)}
        = 25 lambda_mu^2 <rho_r^2>_chi ≈ 4.06863235008162 lambda_mu^2` and the conservative Jensen lower envelope `Theta_w^{(J)}
        = 25 lambda_mu^2 <rho_r>_chi^2 ≈ 0.927552032539308 lambda_mu^2`. The card also states the intermediate moments `<rho_r>_chi
        ≈ 0.192619005556493` and `<rho_r^2>_chi ≈ 0.162745294003265` (eq:app-stage077-rho-weights). The notes additionally
        pin the exact support cut point `xi_* = artanh(2/sqrt(alpha_r)-1) ≈ -0.3855810692` and the normalization `I_f = int
        chi^2 = 1/3`, and assert `Theta_w^{(\chi)} >= Theta_w^{(J)}` (Jensen).'
