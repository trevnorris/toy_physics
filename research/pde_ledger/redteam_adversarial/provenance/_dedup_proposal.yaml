      excerpt: 'The scripts faithfully verify exactly what the paper claims: the two symbolic identities (`I_f = 1/3`, the
        exact cut point `xi_*`) are non-tautological independent derivations, and the four numeric deliverables (`<rho>_chi`,
        `<rho^2>_chi`, `Theta_w^{(\chi)}`, `Theta_w^{(J)}`) are recomputed from the explicit profile and compared to the card/notes
        values to ~1e-50 by two independent engines, plus the Jensen ordering is asserted. The coefficient `25` matches the
        upstream stage 076 lock and the appendix. Every emitted value reconciles to the `.tex` and/or `.md` (Value Reconciliation:
        9 values, 0 misaligned). Attacks that failed: (i) the numeric-vs-pinned comparisons are not tautological — the LHS
        is a live integral; (ii) the back-substitution `1 - alpha S(xi_*)^2 = 0` genuinely tests the `atanh` form, it does
