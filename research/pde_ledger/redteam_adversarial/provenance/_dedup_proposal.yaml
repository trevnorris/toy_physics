      role: pass2_stage_report
      stage: '134'
      excerpt: 'The SymPy script builds the D/N kernel `S(Pi,kappa)` from the parent form, takes the `kappa->0` limit (static
        shell channel), substitutes `kappa=pi/2` to form `S_q`, and forms the fixed-point RHS `M_s + M_q*S_q`. It then makes
        three substantive assertions: (1) `S_shell - 1 == 0` exactly (static shell limit, D2); (2) `S_q(p)` at `p=1/2,1,2`
        matches three external 30-digit literals (claimed by comment to be from an independent mpmath run) within 1e-12, exercising
        the closed form D3; (3) `S_q(Pi_star)` matches the notes literal `0.658075937605428` within 1e-12 (D4). The gain line
        (D5) is printed symbolically but intentionally NOT asserted, with a comment explaining that re-asserting `intercept
        == Pi_*` / `slope == -S_q(Pi_*)` would be an X-X tautology and that outlet consistency is verified downstream at Stage
