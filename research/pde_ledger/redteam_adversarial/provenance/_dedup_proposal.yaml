      stage: '134'
      excerpt: 'Stage 134 specializes the general Stage 133 coupled mouth-layer fixed-point law to the first explicit Family-1
        branch: one static shell-compliance lane (`\kappa_s=0`, contributing the exact static limit `\mathcal S(\Pi,0)=1`)
        and one first mixed D/N half-wave lane (`\kappa_q=\pi/2`). The card''s quoted `\stagefield{Output}`-equivalent (the
        boxed result block in the card body) is: "First explicit reduction gives `\(\Pi=M_s+M_q\mathcal S_q(\Pi)\)`." The
        notes add the closed-form kernel `\mathcal S_q(\Pi)=\Pi[\tfrac{\pi}{2}\tanh\tfrac{\pi}{2}+\Pi(e^{-\Pi}\operatorname{sech}\tfrac{\pi}{2}-1)]/[(1-e^{-\Pi})(\tfrac{\pi^2}{4}-\Pi^2)]`,
        the canonical compensation value `\mathcal S_q(\Pi_*)\approx0.658075937605428` at the imported `\Pi_*\approx1.50882951349316`,
        and the canonical gain line `M_s\approx1.50882951349316-0.658075937605428\,M_q`. Distinct deliverables: (D1) the fixed-point
        law `\Pi=M_s+M_qS_q(\Pi)`; (D2) the static shell limit `\mathcal S(\Pi,0)=1`; (D3) the closed-form `S_q(\Pi)`; (D4)
        `S_q(\Pi_*)\approx0.658075937605428`; (D5) the canonical gain line. The card''s `\stagefield{Checks}` explicitly defers
        outlet consistency of `(M_s,M_q)` to Stage 135 and susceptibility closure to Stage 137 ("carried forward here"), and
        states the fixed points are "numerically located, not closed-form constants."'
