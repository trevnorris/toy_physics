- type: provenance_gap
  severity: low
  summary: sigma_min is NOT a posited numeric constant. It is the DERIVED exact minimum of the compensated two-mode source
    sigma(y) = 1 - b + a y + 2 b y^2 over y in [-1,1] (notes line 199-208), a piecewise closed form from boundary/vertex analysis.
    On the Session-I orientation (a_0>0, b_0<0) it reduces to sigma_min(r) = 1 - (a_0 - b_0) s(r) (notes line 452), giving
    the sign-change threshold. The candidate name 'lower_branch_forced' refers to the carried Family-1 quarter-ratio theorem
    that had forced the LOWER compensated branch g_- as the only admissible POSITIVE candidate (notes line 387); the compensated
    family keeps that quarter-ratio surface (R=1/4) but no longer enforces positivity, so sigma_min can go negative. This
    is internal_consistency (a derived extremum / sign-change test). The session readback sigma_min(r_eval) ~ -0.0898 (notes
    line 523) just evaluates it at the imported sample point. Logged for transparency since sigma_min is a derived function,
    not a single inserted value.
