          value:
            enum:
              - COMPOSE
              - DECOMPOSE
              - POWER
              - EQUALITY
              - CONSTRUCT
              - NORMALIZE
              - COMPONENT_ACCESS
              - EVALUATE_EXPRESSION
              - PROJECT
              - RESIDUAL
              - UNDETERMINED
  sympyNodeKindFact:
    allOf:
      - $ref: "#/$defs/sourceFact"
      - properties:
          value:
            oneOf:
              - type: string
                pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                not:
                  const: UNDETERMINED
              - const: UNDETERMINED
  algebraItem:
    type: object
    additionalProperties: false
    required:
      - item_id
      - feature
      - qualified_name
      - semantic_operation
      - python_syntax_or_function
      - accepted_exponent_types
      - accepted_scalar_types
      - return_type
      - failure_behavior
    properties:
      item_id:
        $ref: "#/$defs/itemId"
      feature:
        const: ALGEBRA_OPERATION
      qualified_name:
        $ref: "#/$defs/stringFact"
      semantic_operation:
        $ref: "#/$defs/algebraOperationFact"
      python_syntax_or_function:
        $ref: "#/$defs/stringFact"
      accepted_exponent_types:
        $ref: "#/$defs/stringFactCollection"
      accepted_scalar_types:
        $ref: "#/$defs/stringFactCollection"
      return_type:
        $ref: "#/$defs/stringFact"
      failure_behavior:
        $ref: "#/$defs/stringFact"
  algebraCollection:
    allOf:
      - $ref: "#/$defs/collectionBase"
      - type: object
        additionalProperties: false
        properties:
          items:
            type: array
            items:
              $ref: "#/$defs/algebraItem"
          reason:
            $ref: "#/$defs/nonEmptyString"
