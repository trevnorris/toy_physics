      - applicability
      - value_type
      - normalization_on_construction
      - equality_semantics
      - hashability
      - component_access
      - algebra
      - expression_evaluator
      - presentation
    properties:
      applicability:
        const: APPLICABLE
      value_type:
        $ref: "#/$defs/stringFact"
      normalization_on_construction:
        $ref: "#/$defs/contractFeature"
      equality_semantics:
        $ref: "#/$defs/contractFeature"
      hashability:
        $ref: "#/$defs/contractFeature"
      component_access:
        $ref: "#/$defs/contractFeature"
      algebra:
        $ref: "#/$defs/algebraCollection"
      expression_evaluator:
        $ref: "#/$defs/evaluator"
      presentation:
        $ref: "#/$defs/presentationCollection"
  representationContract:
    oneOf:
      - $ref: "#/$defs/applicableRepresentationContract"
      - $ref: "#/$defs/notApplicableSection"
  bindingScopeFact:
