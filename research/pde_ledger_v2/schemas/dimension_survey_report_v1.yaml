    additionalProperties: false
    required:
      - status
      - supported_sympy_node_kinds
      - numeric_zero_policy
      - missing_symbol_policy
      - non_homogeneous_add_policy
    properties:
      status:
        allOf:
          - $ref: "#/$defs/sourceFact"
          - properties:
              value:
                enum: [PRESENT, ABSENT, UNDETERMINED]
      supported_sympy_node_kinds:
        allOf:
          - $ref: "#/$defs/collectionBase"
          - type: object
            additionalProperties: false
            properties:
              items:
                type: array
                items:
                  $ref: "#/$defs/evaluatorNodeKindFeature"
              reason:
                $ref: "#/$defs/nonEmptyString"
      numeric_zero_policy:
        $ref: "#/$defs/policyOrNotApplicable"
      missing_symbol_policy:
        $ref: "#/$defs/policyOrNotApplicable"
      non_homogeneous_add_policy:
        $ref: "#/$defs/policyOrNotApplicable"
  evaluatorNodeKindFeature:
