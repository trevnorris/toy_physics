      - type: object
        additionalProperties: false
        properties:
          items:
            type: array
            items:
              $ref: "#/$defs/consumerItem"
          reason:
            $ref: "#/$defs/nonEmptyString"
  dimensionBindingItem:
    type: object
    additionalProperties: false
    required:
      - item_id
      - name
      - qualified_scope
      - scope
      - binding_locus
      - branch_or_state_predicate
      - source_text
      - literal_or_derived
      - depends_on_active_mutation
      - depends_on_other_runtime_state
      - consumers
      - ownership
      - uses
      - alias_of
    properties:
      item_id:
        $ref: "#/$defs/itemId"
      name:
        $ref: "#/$defs/stringFact"
      qualified_scope:
        $ref: "#/$defs/stringFact"
        description: >-
          Qualified enclosing lexical/container scope. It may include the
          binding as a terminal segment; anchor matching removes that terminal
          binding and compares the enclosing scope separately from name.
          For stage042 map-key anchors, dimension_guard.B,
          dimension_guard.dims.B, and dimension_guard.dims["B"] normalize to
          the same lexical scope dimension_guard; the dims container is not a
          nested lexical scope. The same convention applies to C, K, and cE.
      scope:
        $ref: "#/$defs/bindingScopeFact"
      binding_locus:
        $ref: "#/$defs/locus"
      branch_or_state_predicate:
        $ref: "#/$defs/stringFact"
        description: >-
          Verbatim source predicate/state text with source loci, not
          surveyor-authored branch prose. Anchor state is established from
          structured dependency facts plus the row's required uses.
      source_text:
        $ref: "#/$defs/stringFact"
      literal_or_derived:
        $ref: "#/$defs/literalDerivedFact"
      depends_on_active_mutation:
        $ref: "#/$defs/boolFact"
      depends_on_other_runtime_state:
        $ref: "#/$defs/boolFact"
      consumers:
        $ref: "#/$defs/consumerCollection"
      ownership:
        $ref: "#/$defs/ownershipFact"
      uses:
        $ref: "#/$defs/useCollection"
      alias_of:
        $ref: "#/$defs/refCollection"
  dimensionBindingSectionApplicable:
    type: object
    additionalProperties: false
    required: [applicability, items]
    properties:
      applicability:
        const: APPLICABLE
      items:
        type: array
        items:
          $ref: "#/$defs/dimensionBindingItem"
      reason:
        $ref: "#/$defs/nonEmptyString"
    allOf:
      - if:
          properties:
            items:
              maxItems: 0
        then:
          required: [reason]
  dimensionBindingSection:
    oneOf:
      - $ref: "#/$defs/dimensionBindingSectionApplicable"
      - $ref: "#/$defs/notApplicableSection"
  dimensionUseSiteItem:
    type: object
    additionalProperties: false
    required: [item_id, source_text, locus, uses, binding_refs]
    properties:
      item_id:
        $ref: "#/$defs/itemId"
      source_text:
        $ref: "#/$defs/stringFact"
      locus:
        $ref: "#/$defs/locus"
      uses:
        $ref: "#/$defs/useCollection"
      binding_refs:
        $ref: "#/$defs/refCollection"
  dimensionUseSiteSectionApplicable:
    type: object
    additionalProperties: false
    required: [applicability, items]
    properties:
      applicability:
        const: APPLICABLE
      items:
        type: array
        items:
          $ref: "#/$defs/dimensionUseSiteItem"
      reason:
        $ref: "#/$defs/nonEmptyString"
    allOf:
      - if:
          properties:
            items:
              maxItems: 0
        then:
          required: [reason]
  dimensionUseSiteSection:
    oneOf:
      - $ref: "#/$defs/dimensionUseSiteSectionApplicable"
      - $ref: "#/$defs/notApplicableSection"
  importContext:
    type: object
    additionalProperties: false
    required:
      - existing_local_import_pattern
      - invocation_assumptions
      - module_scope_side_effects
    properties:
      existing_local_import_pattern:
        $ref: "#/$defs/stringFact"
      invocation_assumptions:
        $ref: "#/$defs/stringFact"
      module_scope_side_effects:
        $ref: "#/$defs/stringFact"
