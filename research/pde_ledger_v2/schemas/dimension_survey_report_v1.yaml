        additionalProperties: false
        properties:
          item_id:
            $ref: "#/$defs/itemId"
          feature:
            enum:
              - CONSTRUCTION_NORMALIZATION
              - EQUALITY_SEMANTICS
              - HASHABILITY
              - COMPONENT_ACCESS
              - EVALUATOR_NODE_KIND
              - NUMERIC_ZERO_POLICY
              - MISSING_SYMBOL_POLICY
              - NON_HOMOGENEOUS_ADD_POLICY
