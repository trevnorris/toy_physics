schema_version: dimension_survey_reject_fixture_v1
base_document: ../report_undetermined_present_accept.yaml
mutations:
  - op: add
    path: [basis, axis_evidence, items, 2]
    value:
      source_spelling: {value: M, loci: &arity_basis [synthetic/undetermined_present.py:20]}
      interpreted_axis_name: {value: M, loci: *arity_basis}
      evidence: {value: INFERRED_FROM_USAGE, loci: *arity_basis}
      locus: synthetic/undetermined_present.py:20
  - op: replace
    path: [basis, orders, items, 0, axes]
    value: [L, T, M]
  - op: replace
    path: [basis, orders, items, 1, axes]
    value: [L, T, M]
  - op: replace
    path: [basis, orders, items, 1, same_as_order, axes]
    value: [L, T, M]
