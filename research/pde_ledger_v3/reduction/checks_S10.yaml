# S10 harness config. ⛔ This file maps NAMES to emitted tags.
# ⛔ No expected physics value appears here: no root, no count, no derived
# dimension, no sign. primitive_dimensions is the one narrow exception and holds
# only DEFINITIONAL conventions -- a displacement is a length, a wavevector an
# inverse length -- ⛔ never a derived result.
#
# ⚠ COVERAGE LIMIT, and it is a SPEC gap not an engine defect: §8 pinned the tag
# PREFIX grammar and never pinned the QUANTITY names, so both engines obeyed it
# and still diverged (Q5_ORIGINAL_ROOT vs Q5_ROOT_ORIGINAL; engine 2 suffixes
# dimension info onto object names where engine 1 emits separate families).
# ⇒ the pairs below are a SUBSET of what could be compared. ⛔ Do not read the
# cross-engine agree count as covering every emitted quantity.
default_engine: wl
main_package: MAIN
control_packages: [XFORM_FULLGRAD, XFORM_DIVONLY, XFORM_SIGNFLIP, XFORM_ANISO, XCOEF_SCALE]

derived_dimensions:
  rhoBr: WL_S10_MAIN_D3_Q6_INERTIAL_COEFFICIENT_DIMENSIONS_SPECIALIZED
  muR: WL_S10_MAIN_D3_Q6_STIFFNESS_COEFFICIENT_DIMENSIONS_SPECIALIZED

primitive_dimensions:
  t: [0, 1, 0]
  omegaSquared: [0, -2, 0]
  omega: [0, -1, 0]
  phase: [0, 0, 0]
  x1: [1, 0, 0]
  u1: [1, 0, 0]
  a1: [1, 0, 0]
  k1: [-1, 0, 0]
  x2: [1, 0, 0]
  u2: [1, 0, 0]
  a2: [1, 0, 0]
  k2: [-1, 0, 0]
  x3: [1, 0, 0]
  u3: [1, 0, 0]
  a3: [1, 0, 0]
  k3: [-1, 0, 0]
  x4: [1, 0, 0]
  u4: [1, 0, 0]
  a4: [1, 0, 0]
  k4: [-1, 0, 0]
  x5: [1, 0, 0]
  u5: [1, 0, 0]
  a5: [1, 0, 0]
  k5: [-1, 0, 0]
  x6: [1, 0, 0]
  u6: [1, 0, 0]
  a6: [1, 0, 0]
  k6: [-1, 0, 0]

dimensionless:
  - D
  - braneDimension
  - lambdaScale
  - lambda_scale
  - sRho
  - s_rho
  - coefficientScale
  - s
  - Sign
  - Im

# ⭐ Engine-local BY DECLARATION -- cannot exist in both engines (one reads a
# registry the other is barred from; each CAS emits its own solver-route tags).
# ⛔ Excluded from per-engine main-vs-control parity and cross-engine tag-set
# parity only; still checked by every other applicable layer.
parity_exclude:
  - _LOCAL_

