      muR: {tag_template: 'WL_S10_{package}_D{dimension}_Q6_STIFFNESS_COEFFICIENT_DIMENSIONS', dimensions: [3], shape: family}
  - engine: py
    package: MAIN
    symbols:
      rho_br: {tag_template: 'PY_S10_{package}_D{dimension}_Q6_INERTIAL_COEFFICIENT1_Q6_DIMENSIONS', dimensions: [2, 3, 4, 5], shape: nested_family}
      mu_R: {tag_template: 'PY_S10_{package}_D{dimension}_Q6_STIFFNESS_COEFFICIENT1_Q6_DIMENSIONS', dimensions: [2, 3, 4, 5], shape: nested_family}
  - engine: py
    package: XFORM_FULLGRAD
    symbols:
      rho_br: {tag_template: 'PY_S10_{package}_D{dimension}_Q6_INERTIAL_COEFFICIENT1_Q6_DIMENSIONS', dimensions: [3, 4], shape: nested_family}
