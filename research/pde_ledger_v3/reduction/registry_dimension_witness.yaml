schema_version: registry-dimension-witness-v2

# A declared_emitted_convention is an input, not a measurement.  Sources with
# axis_measurement reconstruct the vector from emitted axis-labelled solution
# components and cross-check it against the bare emitted vector.
artifacts:
  - id: S9-wl
    engine: wl
    config: checks_S9.yaml
    output: ../mathematica/out/S9_light_requires_shear_mathematica_audit.out
    declared_emitted_convention: LTM-exponent-vector-v1
    selection: {packages: [MAIN]}
    source_metadata:
      WL_S9_RHO_DIMENSION:
        source_class: DERIVED
        specialisations: {D: {registry_value: Q.brane.D_brane}}
      WL_S9_MU_DIMENSION:
        source_class: DERIVED
        specialisations: {D: {registry_value: Q.brane.D_brane}}
    extra_dimension_sources:
      Q.brane.D_brane:
        - tag: WL_S9_SPEED_SQUARED_SYMBOL_DIMENSION_MAP
          select: mapping_value:D
          shape: vector
          source_class: ECHOED
      Q.brane.c_gamma:
        - tag: WL_S9_MU_RHO_DIMENSION_DIFFERENCE
          shape: vector
          source_class: DERIVED
          multiplier: 2
        - tag: WL_S9_VELOCITY_SQUARED_DIMENSION
          shape: vector
          source_class: DERIVED
          multiplier: 2

  - id: S9-py
    engine: py
    config: checks_S9.yaml
    output: ../scripts/out/S9_light_requires_shear_sympy_audit.out
    declared_emitted_convention: LTM-exponent-vector-v1
    selection: {packages: [MAIN]}
    source_metadata:
      PY_S9_MAIN_DIM_PRIMARY_INERTIA:
        source_class: DERIVED
        specialisations: {D: {registry_value: Q.brane.D_brane}}
        axis_measurement:
          tag: PY_S9_MAIN_DIM_SOLUTION
          components: {L: dim_rho_br_L, T: dim_rho_br_T, M: dim_rho_br_M}
      PY_S9_MAIN_DIM_PRIMARY_STIFFNESS:
        source_class: DERIVED
        specialisations: {D: {registry_value: Q.brane.D_brane}}
        axis_measurement:
          tag: PY_S9_MAIN_DIM_SOLUTION
          components: {L: dim_mu_R_L, T: dim_mu_R_T, M: dim_mu_R_M}
    extra_dimension_sources:
      Q.brane.c_gamma:
        - tag: PY_S9_MAIN_DIM_STIFFNESS_MINUS_INERTIA
          shape: vector
          source_class: DERIVED
          multiplier: 2
          axis_measurement:
            tag: PY_S9_MAIN_DIM_SOLUTION
            components:
              L: dim_mu_R_L - dim_rho_br_L
              T: dim_mu_R_T - dim_rho_br_T
              M: dim_mu_R_M - dim_rho_br_M

  - id: S10-wl
    engine: wl
    config: checks_S10.yaml
    output: ../mathematica/out/S10_brane_mode_spectrum_mathematica_audit.out
    declared_emitted_convention: LTM-exponent-vector-v1
    selection: {packages: [MAIN], dimensions: [2, 3, 4, 5]}
    source_metadata:
      'WL_S10_{package}_D{dimension}_Q6_INERTIAL_COEFFICIENT_DIMENSIONS':
        source_class: DERIVED
        specialisations: {braneDimension: {branch_dimension_from: Q.brane.D_brane}}
        axis_measurement:
          tag_template: 'WL_S10_{package}_D{dimension}_Q6_DIMENSION_SOLUTIONS'
          components: {L: dimRhoLength, T: dimRhoTime, M: dimRhoMass}
      'WL_S10_{package}_D{dimension}_Q6_STIFFNESS_COEFFICIENT_DIMENSIONS':
        source_class: DERIVED
        specialisations: {braneDimension: {branch_dimension_from: Q.brane.D_brane}}
        axis_measurement:
          tag_template: 'WL_S10_{package}_D{dimension}_Q6_DIMENSION_SOLUTIONS'
          components: {L: dimMuLength, T: dimMuTime, M: dimMuMass}

  - id: S10-py
    engine: py
    config: checks_S10.yaml
    output: ../scripts/out/S10_brane_mode_spectrum_sympy_audit.out
    declared_emitted_convention: LTM-exponent-vector-v1
    selection: {packages: [MAIN], dimensions: [2, 3, 4, 5]}
    source_metadata:
      'PY_S10_{package}_D{dimension}_Q6_INERTIAL_COEFFICIENT1_Q6_DIMENSIONS':
        source_class: DERIVED
        specialisations: {D: {branch_dimension_from: Q.brane.D_brane}}
        axis_measurement:
          tag_template: 'PY_S10_{package}_D{dimension}_Q6_DIMENSION_SOLUTION'
          components: {L: rho_br_dim_length, T: rho_br_dim_time, M: rho_br_dim_mass}
      'PY_S10_{package}_D{dimension}_Q6_STIFFNESS_COEFFICIENT1_Q6_DIMENSIONS':
        source_class: DERIVED
        specialisations: {D: {branch_dimension_from: Q.brane.D_brane}}
        axis_measurement:
          tag_template: 'PY_S10_{package}_D{dimension}_Q6_DIMENSION_SOLUTION'
          components: {L: mu_R_dim_length, T: mu_R_dim_time, M: mu_R_dim_mass}
    extra_dimension_sources:
      Q.brane.D_brane:
        - tag: PY_S10_LOCAL_REGISTRY_D_BRANE_DIMENSION
          shape: vector
          source_class: ECHOED

  - id: S11-wl
    engine: wl
    output: ../mathematica/out/S11_stray_longitudinal_mathematica_audit.out
    declared_emitted_convention: LTM-exponent-vector-v1
    extra_dimension_sources:
      Q.brane.c_L:
        - tag: WL_S11_MAIN_D3_ROOT1_DIM_OVER_KSQ
          shape: vector
          source_class: DERIVED
          multiplier: 2
