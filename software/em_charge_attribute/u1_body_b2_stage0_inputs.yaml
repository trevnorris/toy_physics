fourier_convention:
  inverse_time: "f(t)=Integral[domega, fhat(omega)*exp(-I*omega*t)]"
  forward_time: "fhat(omega)=(1/(2*pi))*Integral[dt, f(t)*exp(+I*omega*t)]"
  inverse_space: "f(x)=Integral[d^d k, fhat(k)*exp(+I*k.x)]"
  forward_space: "fhat(k)=(1/(2*pi)^d)*Integral[d^d x, f(x)*exp(-I*k.x)]"
  derivative_map: {dt: "-I*omega", grad: "+I*k"}
  retarded_boundary_value: "omega -> omega + I*0_plus"
  pole_half_plane: lower
  directive_source: "section 3.1 fixed transform/sign duty"

causal_definition:
  prescription: retarded_outgoing_no_incoming
  status: DEFINES_RADIATIVE_RESIDUE
  s4_declared_input: false
  justification: "Spec 7.7 radiative residue denotes the retarded/no-incoming response; advanced or time-symmetric responses are not radiative residues."
  fallback: upstream_7_0_amendment_before_production_if_reviewer_rejects_definitional_reading

observation_recipe:
  tracer: descendant_strace_plus_runner_preload_first_use_digest
  process_tree: all_descendants_via_fork_vfork_clone_execve
  parsed_event_syscalls: [openat, openat2, execve, chdir, fchdir, close, dup, dup2, dup3, connect, sendto, sendmsg, sendmmsg, unlink, unlinkat, rename, renameat, renameat2, truncate]
  process_tree_events: [clone, clone3, fork, vfork]
  network_enforcement_only_syscalls: [socket, bind, listen]
  trace_options: [-ff, -qq, -yy, -ttt, -s, "4096"]
  repository_root: /var/projects/toy_physics
  canonicalization:
    - resolve_relative_paths_against_traced_process_cwd
    - resolve_at_family_relative_paths_against_each_traced_process_dirfd
    - inherit_cwd_and_dirfd_state_across_clone_fork_vfork
    - normalize_dot_and_dotdot_without_following_a_changed_symlink_after_first_use
    - retain_repository_local_regular_files_only
    - exclude_dot_git_implementation_metadata_after_binding_git_show_blob_bytes
    - snapshot_initial_path_existence_before_the_scope_starts
    - classify_only_initially_absent_paths_whose_actual_first_file_event_is_CREATE_as_generated_output
    - retain_read_before_write_paths_in_observed_dependencies
  network_policy: "bubblewrap network namespace plus non-loopback socket denial; Wolfram WSTP loopback IPC remains local"
  no_write_policy: "all write/truncate/rename/unlink events checked against Protected; aggregates writable only by merger"
  first_use_audit:
    mechanism: "runner hashes successful open/openat/openat2 descriptors before return, pre-reads Wolfram regular-file arguments before kernel dispatch, and snapshots executable/loaded objects before application main or dlopen return; strace independently records the descendant recipe"
    record_kinds: [executed_binary, loaded_shared_library, opened_regular_file]
    environment_categories: [executed_binary, loaded_shared_library, loader, imported_python_module, wolfram_installation_file]
    exact_production_comparison: "Obs_B2 - generated_output - stage0_container == frozen Obs_B2 manifest"

no_network:
  denied_destinations: [non_loopback_AF_INET, non_loopback_AF_INET6]
  allowed_local_ipc_families: [AF_UNIX, AF_NETLINK, loopback_AF_INET, loopback_AF_INET6]
  wolframscript_local_loopback_exception: required_by_WSTP_startup
  namespace_attempt_required: true
  bubblewrap_network_only_namespace_status: available
  trust_mode_effect: "none; traced duties and the separately orchestrator-pinned environment-identity record both remain live"
  enforcement: bubblewrap_unshare_net_plus_LD_PRELOAD_external_connect_sendto_denial_and_loopback_bind_rewrite_plus_supervised_syscall_assertion
