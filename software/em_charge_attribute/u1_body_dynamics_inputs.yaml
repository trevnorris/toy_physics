schema_version: U1_PHASE_A_FIELD_INPUTS_V2
directive_version: 5
spec_version: 3.1
phase: A

# Production contains field/action/geometry/boundary data only.  In particular it
# contains no decay exponent, spectral sign, classification boolean, or verdict.
ambient:
  coordinates: [x, y, z, w]
  brane_coordinates: [x, y, z]
  background_branch: symmetric_postulate
  parity_map: {x: x, y: y, z: z, w: -w}
  medium_rest_velocity: [0, 0, 0, 0]

geometry:
  a: {value: 1, dimensions: [1, 0, 0], role: mouth_radius}
  L: {value: 37/20, dimensions: [1, 0, 0], role: sleeve_extent}
  control_surface_radius: {value: 40, dimensions: [1, 0, 0], role: predeclared_IR_radius}
  wall_side: {values: [-1, 1], role: body_conjugation_label}

coefficients:
  hbar: {value: 1, dimensions: [2, -1, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage004}
  m_GNLS: {value: 1, dimensions: [0, 0, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage004}
  rho_inf: {value: 1, dimensions: [-4, 0, 0], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage004}
  K_EOS: {value: 1, dimensions: [18, -2, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage004_stage005}
  aB: {value: 3/2, dimensions: [-2, -2, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage006}
  kappaB: {value: 2, dimensions: [0, -2, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage006}
  muR4: {value: 6/5, dimensions: [-2, -2, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage006}
  alphaAniso: {value: 1/5, dimensions: [-2, -2, 1], status: WHITELIST_SOURCED, constraint: nonnegative, source: ledger_stage006}
  rhoBr: {value: 4/3, dimensions: [-3, 0, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage007}
  muR: {value: 5/4, dimensions: [-1, -2, 1], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage007}
  lambdaPu: {value: 1/10, dimensions: [-1, -2, 1], status: WHITELIST_SOURCED, constraint: real, source: ledger_stage007}
  OmegaW: {value: 7/5, dimensions: [0, -1, 0], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage007}
  ellg: {value: 3/4, dimensions: [1, 0, 0], status: WHITELIST_SOURCED, constraint: positive, source: ledger_stage007}
  Mh: {value: Mh, dimensions: [0, -2, 1], status: OPEN_INPUT, constraint: positive, source: pathA_38_dynamic_normalization_open}
  cE: {value: cE, dimensions: [1, -1, 0], status: OPEN_INPUT, constraint: positive, source: pathA_38_dynamic_speed_open}
  mdot: {value: 1/8, dimensions: [0, -1, 1], status: OPEN_INPUT, constraint: positive, source: spec_7_0_fixed_intake}
  gammaSigma: {value: 2/3, dimensions: [0, 0, 0], status: OPEN_INPUT, constraint: positive, source: U2_E5_field_Rayleigh}
  tangentDtN: {value: 5/6, dimensions: [0, 0, 0], status: OPEN_INPUT, constraint: positive, source: U2_E5_field_surface_DtN}

field_records:
  - id: sleeve_core_trace
    status: OPEN_INPUT
    root_type: PRIMITIVE_OPEN
    domain: scalar_field_trace_on_Sigma
    dimensions: [0, 0, 0]
    arguments: [field_point, outward_normal, wall_side, a, L]
    symmetry_class: BODY_CONJUGATE_SCALAR
    source: nonlinear_throat_core_open
  - id: geon_core_bundle
    status: OPEN_INPUT
    root_type: PRIMITIVE_OPEN
    domain: field_trace_bundle_on_Sigma
    dimensions: [0, 0, 0]
    arguments: [density_trace, polar_trace, h_trace, phase_flux_trace, wall_side]
    symmetry_class: BODY_CONJUGATE_BUNDLE
    source: spec_7_0_geon_profile_open
  - id: throat_surface_functional
    status: OPEN_INPUT
    root_type: ACTION
    domain: field_functional_on_Sigma
    dimensions: [2, -2, 1]
    arguments: [field_traces, normal_derivatives, induced_metric]
    symmetry_class: BODY_CONJUGATE_SCALAR
    source: ledger_stage006_f_throat
  - id: outer_surface_functional
    status: OPEN_INPUT
    root_type: ACTION
    domain: field_functional_on_partial_Omega_c
    dimensions: [2, -2, 1]
    arguments: [field_traces, outward_normal, ambient_branch]
    symmetry_class: AMBIENT_BRANCH_COVARIANT
    source: return_surface_action_open
  - id: native_continuity
    status: WHITELIST_SOURCED
    root_type: BALANCE
    domain: fields_on_time_x_Omega_c
    dimensions: [-4, -1, 0]
    arguments: [number_density_field, velocity_field]
    symmetry_class: R_W_COVARIANT
    source: ledger_stage004_stage006
  - id: native_momentum
    status: WHITELIST_SOURCED
    root_type: BALANCE
    domain: fields_on_time_x_Omega_c
    dimensions: [-3, -2, 1]
    arguments: [momentum_density_field, native_stress_tensor, action_force_density]
    symmetry_class: R_W_COVARIANT
    source: GNLS_wall_polar_shear_h_action
  - id: E4_shear_lock
    status: OPEN_INPUT
    root_type: CONSTRAINT
    domain: velocity_trace_functional_on_collar
    dimensions: [1, -1, 0]
    arguments: [bulk_velocity_trace, shear_velocity_trace, collar_kernel]
    symmetry_class: BODY_CONJUGATE_VECTOR
    source: U2_seam
  - id: E5_rayleigh
    status: OPEN_INPUT
    root_type: RAYLEIGH
    domain: tangential_velocity_trace_functional_on_Sigma
    dimensions: [2, -3, 1]
    arguments: [bulk_velocity_trace, sleeve_velocity_trace, gammaSigma]
    symmetry_class: BODY_CONJUGATE_SCALAR
    source: U2_seam
  - id: return_closure
    status: OPEN_INPUT
    root_type: RETURN
    domain: structured_field_flux_map_on_partial_Omega_c
    dimensions: [0, -1, 1]
    arguments: [mass_flux_density, momentum_flux_density, destination_field]
    symmetry_class: AMBIENT_BRANCH_COVARIANT
    source: pathA_29_open_return

# These are the terms assembled by both engines.  Completeness is checked by
# loading and parsing the cited stage-note/freeze sources, not against a list in code.
action_terms:
  # Executable scalar-invariant action records.  Both engines parse these,
  # substitute the ambient/background fields, and differentiate the assembled
  # expression; no channel coefficient or classification is stored here.
  - {id: bulk_berry, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage004_gnls_action_dimensional_foundation.md, source_contains: "i hbar psi* d_t psi", expression: "-hbar*n*theta_t"}
  - {id: bulk_flow_kinetic, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage006_two_phase_chiB_ontology.md, source_contains: "(1/2) m_GNLS n |u|^2", expression: "m_GNLS*n*v2/2"}
  - {id: quantum_pressure, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_35_G0_freeze.md, source_contains: "QP := (hbar^2/(8 m rho))", expression: "hbar^2*n_grad2/(8*m_GNLS*n)"}
  - {id: bulk_EOS, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage004_gnls_action_dimensional_foundation.md, source_contains: "U(rho) = (K/4) rho^5", expression: "K_EOS*n^5/4"}
  - {id: wall_double_well, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage006_two_phase_chiB_ontology.md, source_contains: "f_B(chi_B) = a_B chi_B^2 (1-chi_B)^2", expression: "aB*chiB^2*(1-chiB)^2"}
  - {id: wall_gradient, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage006_two_phase_chiB_ontology.md, source_contains: "(kappa_B/2)|grad_4 chi_B|^2", expression: "kappaB*chi_grad2/2"}
  - {id: wall_shear_gate, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage006_two_phase_chiB_ontology.md, source_contains: "chi_B f_shear", expression: "chiB*muR4*ud_curl2/2"}
  - {id: wall_anisotropy, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage006_two_phase_chiB_ontology.md, source_contains: "alpha_aniso chi_B (P·w_hat)^2", expression: "alphaAniso*chiB*Pnormal2"}
  - {id: throat_source, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage006_two_phase_chiB_ontology.md, source_contains: "f_throat", expression: "f_throat", support: core_surface}
  - {id: wall_mix, root_type: ACTION, source_file: research/pde_ledger_v2/notes/stages/ledger_stage006_two_phase_chiB_ontology.md, source_contains: "f_mix", expression: "f_mix", support: core_surface}
  - {id: polar_kinetic, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_24_T0_freeze.md, source_contains: "(1/2) m rho a^2 (D_t^v P^i)(D_t^v P^i)", expression: "m_GNLS*n*a^2*DtP2/2"}
  - {id: polar_gradient, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_24_T0_freeze.md, source_contains: "(1/2) m rho c_s^2(rho) a^2 (partial_j P^i)(partial_j P^i)", expression: "m_GNLS*n*cs2*a^2*P_grad2/2"}
  - {id: polar_quartic, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_24_T0_freeze.md, source_contains: "(1/4) m rho c_s^2(rho) (P^i P^i - 1)^2", expression: "m_GNLS*n*cs2*(P2-1)^2/4"}
  - {id: brane_shear_kinetic, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_35_G0_freeze.md, source_contains: "(1/2) rho_br (partial_t u^a)(partial_t u^a)", expression: "g_ell*rhoBr*u_t2/2"}
  - {id: brane_shear_gradient, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_35_G0_freeze.md, source_contains: "(1/2) mu_R Omega_u^a Omega_u^a", expression: "g_ell*muR*u_curl2/2"}
  - {id: Pu_coupling, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_35_G0_freeze.md, source_contains: "L_Pu := - lambda_Pu varpi_a Omega_u^a", expression: "g_ell*lambdaPu*Pt*u_curl"}
  - {id: uw_kinetic, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_35_G0_freeze.md, source_contains: "(1/2) rho_br (partial_t u_w)^2", expression: "g_ell*rhoBr*uw_t2/2"}
  - {id: uw_gap, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_35_G0_freeze.md, source_contains: "(1/2) rho_br Omega_w^2 u_w^2", expression: "g_ell*rhoBr*OmegaW^2*uw^2/2"}
  - {id: h_kinetic, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_38_throat_body_electric_localization.md, source_contains: "dynamic", expression: "Mh*h_t2/(2*cE^2)", status: OPEN_INPUT}
  - {id: h_gradient, root_type: ACTION, source_file: software/stage1_solver/reports/pathA_38_throat_body_electric_localization.md, source_contains: "radial branch", expression: "Mh*h_grad2/2", status: OPEN_INPUT}

core_traces:
  density_delta: {value: 1/5, field: number_density, surface: Sigma}
  wall_delta: {value: 1/3, field: chiB, surface: Sigma}
  polar_tangent: {value: 1/4, field: P_tangent, surface: Sigma}
  polar_radial: {value: 1/10, field: P_radial, surface: Sigma}
  shear_transverse: {value: 1/6, field: u_transverse, surface: collar}
  h_scalar: {value: 1/7, field: h, surface: Sigma}
  tilt_phase: {value: 1/9, field: phase_tilt_mode, surface: Sigma}
  tilt_polar: {value: 1/8, field: polar_tilt_mode, surface: Sigma}
  tilt_shear: {value: 1/11, field: shear_tilt_mode, surface: collar}
  tilt_h: {value: 1/12, field: h_tilt_mode, surface: Sigma}

endpoints:
  E1:
    condition: "v.normal=V.normal and v.tangent=V.tangent on Sigma"
    variational_class: holonomic_field_BC
    trace_unknowns: [normal, tangent, shear]
    trace_system: {matrix: [[1, 1, 0], [1, -1, 0], [0, 1, 1]], rhs: [2, 0, 1]}
    channels: {var: [E1_holonomic_surface], flux: [outer_control_flux], constraint: [], Rayleigh: [], rad: []}
  E2:
    condition: "v.normal=V.normal and tangential_traction=0 on Sigma"
    variational_class: holonomic_field_BC
    trace_unknowns: [normal, tangent, shear]
    trace_system: {matrix: [[1, 1, 0], [0, 2, 0], [1, 0, 1]], rhs: [1, 0, 1]}
    channels: {var: [E2_free_slip_surface], flux: [outer_control_flux], constraint: [], Rayleigh: [], rad: []}
  E3:
    condition: "permeable phase texture; no velocity trace tied to V"
    variational_class: bulk_action
    trace_unknowns: [normal, tangent, shear]
    trace_system: {matrix: [[2, 1, 0], [1, -1, 0], [0, 1, 2]], rhs: [0, 0, 0]}
    channels: {var: [E3_bulk_texture], flux: [outer_control_flux], constraint: [], Rayleigh: [], rad: []}
  E4:
    condition: "g_A=V_A-C_A[uT_dot at collar]=0"
    variational_class: nonholonomic_constraint
    trace_unknowns: [normal, tangent, shear]
    trace_system: {matrix: [[1, 1, 0], [1, -1, 0], [0, 1, 1]], rhs: [0, 0, 1]}
    channels: {var: [E4_bulk_texture], flux: [outer_control_flux], constraint: [E4_shear_lock_reaction], Rayleigh: [], rad: []}
  E5:
    condition: "v.normal=V.normal; tangentDtN*v.tangent+gammaSigma*(v.tangent-V.tangent)=0"
    variational_class: Rayleigh
    trace_unknowns: [normal, tangent, shear]
    trace_system:
      matrix: [[2, 0, 0], [1, "tangentDtN+gammaSigma", 0], [0, 1, 1]]
      rhs: [2, "1+gammaSigma", "gammaSigma/(tangentDtN+gammaSigma)"]
    channels: {var: [E5_normal_surface], flux: [outer_control_flux], constraint: [], Rayleigh: [E5_tangential_loss], rad: []}

kinematics:
  coordinate_map: {body_coordinate: y_i, lab_coordinate: x_i, displacement_field: "X_i(t)", displacement_coefficient: -1}
  scalar_pullback: {lab_field: "f_lab(t,x)", body_field: "f_body(y(t,x))"}
  momentum_flux: {stress_tensor: Pi_ij, convective_velocity: V_j, momentum_density: g_i, convective_coefficient: -1}
  control_volume: co_moving
  base_state_class: co_moving_steady

ir_scheme:
  name: ambient_subtracted_exterior_ball
  radial_domain: "a<=r<=R followed by R/a->infinity"
  surface_core_owner: throat_surface_functional
  ambient_subtraction: homogeneous_action_and_stress
  g9_tolerance:
    force_scale: "mdot*sqrt(5*K_EOS*rho_inf^4/m_GNLS)"
    relative_terms: "(a/R)^2+epsilon_rigid^2+epsilon_quad"
    epsilon_rigid: 1/100
    epsilon_quad: 1/10000

partition:
  acceleration_like_outer_flux_owner: future_C_mdot
  phase_A_L_eff_outer_flux_terms: []
  E1_reaction_owner: variational_holonomic_surface

parity_cases:
  symmetric_postulate: {background_map: {w: "-w"}}
  one_sided_pathA29: {background_map: {operator: ambient_asymmetry_map, arguments: [background_fields, s, slab_data]}}
