schema: pathA_29_brane_bulk_return_sympy/v3
top_line_verdict: RETURN_RESIDUAL_PREDICTION
Z_is_premise: true
pathA_28_reuse:
  pathA_28_results: software/stage1_solver/reports/pathA_28_monopole_results.yaml
  pathA_28_condition: software/stage1_solver/reports/pathA_28_cancellation_condition.yaml
  raw_kernels_reused_verbatim:
    ell0:
      kernel: I*a*omega/cS
      p_raw: 1
    ell1:
      kernel: I*a**3*omega**3/(2*cS**3)
      p_raw: 3
    ell2:
      kernel: I*a**5*omega**5/(27*cS**5)
      p_raw: 5
  source_moment_definitions_reused:
    ell0: M0(omega)=int_brane S_leak(omega,x) d^3x
    ell1: D1_i(omega)=int_brane x_i S_leak d^3x + int_brane j_i d^3x, including carried odd wake contribution when present
  cancellation_target_reused:
    ell0: R0(omega)=int_brane S_return(omega,x) d^3x = -M0(omega)
    ell1: R1_i(omega)=-D1_i(omega) for each dipole component
  quadrupole_anchor_reused:
    p_raw: 5
    kernel: I*a**5*omega**5/(27*cS**5)
    research_anchor: research/4d_2_5pn
slab_structure:
  structure_id: a91d8cb3bb342101866760dd8291af795b6240cc6ee0cfcb8dafae5097f358be
  canonical_form: pathA29_v3|flat_slab:0<=w<=d|warp:A(w)=1|bulk_eq:Phi_ww+(omega/c_s)^2 Phi=0|checkA:continuity_fraction_alpha_l=1/(1+epsilon_l),phase=exp(I*omega*2d/c_s)|checkB:destructuring_absorbing:compact_cell_natural_dc_sink_spectrum|checkB:bloch_stack:q=0_periodic_cell|radiation:ac_check_a_only|Z_is_premise:true|boundary_dof:none
  spacing_d:
    value: d>0 finite
    status: postulated
  dimensionality_of_return:
    value: one flat finite bulk w-slab; return fractions epsilon_l/(1+epsilon_l) are continuity partition parameters, not
      source fits
    status: postulated
  warp_ansatz:
    value: flat A(w)=1 for the main family
    status: postulated
  derived_neighbor_BC_equations:
    destructuring_absorbing:
      status: derived
      physical_completion: section-5 de-structuring/absorbing DC sink; drain admittance is the premise and is represented
        in the continuity source term Z, not by a tuned wall impedance
      transverse_equations:
      - -f''(w)=m^2 f(w)
      - f'(0)=0
      - f'(d)=0
    bloch_stack:
      status: derived
      physical_completion: periodic multi-brane stack q=0 Bloch cell with absorbing neighbor branes
      transverse_equations:
      - -f''(w)=m^2 f(w)
      - f(d)=f(0)
      - f'(d)=f'(0)
    radiation:
      status: derived_ac_only
      physical_completion: Sommerfeld outgoing AC transport, tagged ac_check_a_only and excluded from Check B
      equation: partial_w Phi = I*(omega/c_s)*Phi at finite omega; omega->0 Neumann limit is not a Check-B branch
  response:
    value: T_l(omega)=alpha_l*exp(I*omega*2d/c_s) from projected continuity and solved bidirectional Helmholtz transport
    status: derived_not_dialed
  postulate_vs_derived:
    geometry: postulated
    topology: postulated
    BC_functional_forms: derived from declared physical completions
    response: computed from continuity plus transport; not fitted to cancellation
steady_state:
  exists: true
  type: circulation
  provenance:
    zeroth_moment_balance: M0 = M0/(epsilon0 + 1) + M0*epsilon0/(epsilon0 + 1)
    first_moment_balance: D1 = D1/(epsilon1 + 1) + D1*epsilon1/(epsilon1 + 1)
    computed_residuals:
      ell0: '0'
      ell1: '0'
    routing: a candidate with nonzero steady balance is inadmissible; this family has zero balance residual
transfer_function:
  structure_id: a91d8cb3bb342101866760dd8291af795b6240cc6ee0cfcb8dafae5097f358be
  provenance:
    governing_equations:
    - 'bulk Helmholtz transport: partial_w^2 Phi_l + (omega/c_s)^2 Phi_l = 0 on 0<w<d'
    - 'bidirectional basis: Phi_l=A_l*exp(I*omega*w/c_s)+B_l*exp(-I*omega*w/c_s)'
    - round-trip transport phase solved from the Helmholtz basis phase ratios
    - 'zeroth-moment continuity: J_leak_0 = J_return_0 + J_neighbor_0'
    - 'first-moment continuity: J_leak_1 = J_return_1 + J_neighbor_1 including return centroid partition'
    - alpha_l = J_return_l/J_leak_l = 1/(1+epsilon_l), epsilon_l>0
    transit_phase_trace:
      basis: Phi_l=A_l*exp(I*omega*w/c_s)+B_l*exp(-I*omega*w/c_s)
      forward_phase_ratio: exp(I*d*omega/cS)
      return_phase_ratio: exp(I*d*omega/cS)
      round_trip_phase: exp(2*I*d*omega/cS)
      solved_tau: 2*d/cS
      source_hash: 6b5cfc8c8e91b2f534c3b0f8e73942e95f869bc86f59cfca1c099be7f7802cdb
    bc_equations:
    - 'destructuring_absorbing DC sink: compact cell transverse spectrum f''(0)=f''(d)=0; drain flux is the source accounting
      Z'
    - 'Bloch DC-sink cross-check: f(d)=f(0), f''(d)=f''(0)'
    - Sommerfeld radiation is finite-omega AC transport only and is not used for Check B
    solution_basis: Phi_l=A_l*exp(I*omega*w/c_s)+B_l*exp(-I*omega*w/c_s)
    series_coefficients:
      ell0:
        omega^0: 1/(epsilon0 + 1)
        omega^1: 2*I*d/(cS*(epsilon0 + 1))
        omega^2: -2*d**2/(cS**2*(epsilon0 + 1))
        omega^3: -4*I*d**3/(3*cS**3*(epsilon0 + 1))
        omega^4: 2*d**4/(3*cS**4*(epsilon0 + 1))
      ell1:
        omega^0: 1/(epsilon1 + 1)
        omega^1: 2*I*d/(cS*(epsilon1 + 1))
        omega^2: -2*d**2/(cS**2*(epsilon1 + 1))
    free_parameter_table:
      d:
        role: postulated slab spacing
        domain: positive finite
        depends_on_source: false
      epsilon0:
        role: zeroth-moment transmitted-to-returned DC sink partition
        domain: positive
        depends_on_source: false
      epsilon1:
        role: first-moment transmitted-to-returned centroid partition
        domain: positive
        depends_on_source: false
      c_s:
        role: signal speed with restored units
        domain: positive
        depends_on_source: false
    residual_substitution_trace:
      R0_substitution: R0(omega)=-M0*T0(omega)
      R1_substitution: R1(omega)=-D1*T1(omega)
      A0_residual: -I*M0*a*omega*(-3*cS**4*epsilon0 + 6*I*cS**3*d*omega - 6*cS**2*d**2*omega**2 - 4*I*cS*d**3*omega**3 + 2*d**4*omega**4)/(3*cS**5*(epsilon0
        + 1))
      A1_residual: I*D1*a**3*omega**3*(cS**2*epsilon1 - 2*I*cS*d*omega + 2*d**2*omega**2)/(2*cS**5*(epsilon1 + 1))
    forbidden_fit_flags:
      fit_to_cancellation: false
      fit_to_source_moments: false
      T_set_to_one_by_fiat: false
      standalone_frozen_static_solve: false
      falloff_exponent_fit_from_handwritten_vr: false
      m_dependent_impedance_BC: false
      radiation_branch_used_for_Check_B: false
      all_multipole_cancellation: false
  ell0:
    T_ell_omega: (3*cS**4 + 6*I*cS**3*d*omega - 6*cS**2*d**2*omega**2 - 4*I*cS*d**3*omega**3 + 2*d**4*omega**4)/(3*cS**4*(epsilon0
      + 1))
    T_full_unexpanded: exp(2*I*d*omega/cS)/(epsilon0 + 1)
    series_through: O(omega^4)
    T_at_DC: 1/(epsilon0 + 1)
    sigma_l: 1
    nu_l: 0
    computed_from: zeroth-moment continuity fraction times solved Helmholtz round-trip phase
  ell1:
    T_ell_omega: -I*(-cS + d*omega*(1 - I))*(-I*cS + d*omega*(1 - I))/(cS**2*(epsilon1 + 1))
    T_full_unexpanded: exp(2*I*d*omega/cS)/(epsilon1 + 1)
    series_through: O(omega^2)
    T_at_DC: 1/(epsilon1 + 1)
    sigma_l: 1
    nu_l: 0
    computed_from: first-moment continuity fraction times solved Helmholtz round-trip phase
  T_at_DC:
    ell0: 1/(epsilon0 + 1)
    ell1: 1/(epsilon1 + 1)
return_moments:
  R0_omega: -M0*(3*cS**4 + 6*I*cS**3*d*omega - 6*cS**2*d**2*omega**2 - 4*I*cS*d**3*omega**3 + 2*d**4*omega**4)/(3*cS**4*(epsilon0
    + 1))
  R1_omega: I*D1*(-cS + d*omega*(1 - I))*(-I*cS + d*omega*(1 - I))/(cS**2*(epsilon1 + 1))
  target_from_pathA_28:
    R0: -M0
    R1: -D1
residual_amplitude:
  A0_res: -I*M0*a*omega*(-3*cS**4*epsilon0 + 6*I*cS**3*d*omega - 6*cS**2*d**2*omega**2 - 4*I*cS*d**3*omega**3 + 2*d**4*omega**4)/(3*cS**5*(epsilon0
    + 1))
  A1_res: I*D1*a**3*omega**3*(cS**2*epsilon1 - 2*I*cS*d*omega + 2*d**2*omega**2)/(2*cS**5*(epsilon1 + 1))
  p_residual:
    ell0: 1
    ell1: 3
  p_quadrupole: 5
  order_rule: p_res_0=1+nu_0 and p_res_1=3+nu_1; sigma_l is not used in p_res
admissibility_window_A:
  status: none
  strict_window: none
  required_conditions: T0(0)=1 with nu0>=4 and T1(0)=1 with nu1>=2
  computed_obstruction: finite epsilon_l>0 gives nu0=0 and nu1=0; perfect-return epsilon0->0 gives a finite transport phase
    with nu0=1, so strict p_res>=5 is not an open window in this tractable family
  perfect_return_control:
    T0_limit: exp(2*I*d*omega/cS)
    nu0: 1
    p_res0: 2
    p_res1: 4
residual_window_A:
  status: open
  constraints: d>0, c_s>0, epsilon0>0, epsilon1>0, flat localizing slab, admissible DC-sink completion
  p_residual:
    ell0: 1
    ell1: 3
  bounded_residual: true
transverse_mode_spectrum:
  operator: -d^2/dw^2 on the compact finite slab for Check-B DC sinks
  destructuring_absorbing:
    bc_derivation: 'section-5 de-structuring/absorbing DC sink: finite compact cell; drain admittance is carried by Z and
      the field spectrum uses the natural finite-cell zero mode'
    bc_equations:
    - f'(0)=0
    - f'(d)=0
    eigenvalue_equation: sin(m*d)=0
    modes:
    - n: 0
      m_n: '0'
      f_n(w): 1/sqrt(d)
      normalization: '1'
    - n: 1
      m_n: pi/d
      f_n(w): sqrt(2)*cos(pi*w/d)/sqrt(d)
      normalization: '1'
    - n: j>=0
      m_n: j*pi/d
      f_n(w): sqrt((2-delta_j0)/d)*cos(j*pi*w/d)
    proof_residuals:
      zero_ode: '0'
      zero_bc_w0: '0'
      zero_bc_wd: '0'
      first_ode: '0'
      first_bc_w0: '0'
      first_bc_wd: '0'
    spectrum_class: normalizable_zero_mode
  bloch_stack:
    bc_derivation: q=0 Bloch cell of the periodic multi-brane stack with absorbing neighboring branes
    bc_equations:
    - f(d)=f(0)
    - f'(d)=f'(0)
    eigenvalue_equation: m=2*pi*j/d for integer j in the q=0 Bloch sector
    modes:
    - n: 0
      m_n: '0'
      f_n(w): 1/sqrt(d)
      normalization: '1'
    - n: 1
      m_n: 2*pi/d
      f_n(w): sqrt(2)*cos(2*pi*w/d)/sqrt(d)
      normalization: '1'
    proof_residuals:
      zero_ode: '0'
      zero_periodic_value: '0'
      zero_periodic_derivative: '0'
      first_ode: '0'
      first_periodic_value: '0'
      first_periodic_derivative: '0'
    spectrum_class: normalizable_zero_mode
