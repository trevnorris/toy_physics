verdict: DN_UNITTEST_BC_DEPENDENT
reduction_certificate:
  background:
    stationary_reference: straight finite throat, eta=0, s in [0,L0], R0(L0)=0
    psi0: sqrt(rho_star)*exp(-I*mu*t/hbar) with constant rho_star on the centerline
    rho0(s): rho_star
    A_M0: 0 for this scalar unit test
    frozen_wall: R=R0, eta=0; matter perturbation remains dynamic as exp(-I*omega*t)
  projection:
    measure: sqrt(gamma0)(s)=A_perp0 on the straight reference throat
    measure_derivative: '0'
    first_derivative_term: absent because d_s log(sqrt(gamma0))=0
    domain: 0 <= s <= L0; cap is the R0(L0)=0 pinch-off
  rho0_fate:
    rho0_gradient: '0'
    condition: uniform straight reference, O(rho0'/rho0)=0
    retained_in_Ls: false
  cs_of_s_fate:
    cs_squared_from_EOS: 5*K*rho_star**4/m
    cs_gradient: '0'
    condition: c_s is the bulk sound speed sqrt(5*K*rho_star^4/m), not wall/healing
      renormalized
    retained_in_Ls: constant c_s only
  Vconf0_fate:
    V_conf(Sigma0): absorbed into the stationary reference chemical potential / zero
      off the wall
    delta_V_conf: 0 in the frozen eta=0 unit test
    ell_c_role: confinement length in V_wall(Sigma/ell_c); distinct from healing length
      xi
    retained_in_Ls: false
  Q_fate:
    background_grad_Q: '0'
    background_condition: uniform rho0 makes grad Q(rho0)=0 at O(rho0'/rho0)
    delta_Q_Bogoliubov_term: hbar**2*omega**4/(4*cS**4*m**2)
    full_BdG_dispersion: omega^2 = c_s^2*k^2 + hbar^2*k^4/(4*m^2)
    ratio_to_phonon_term: hbar**2*omega**2/(4*cS**4*m**2)
    phonon_limit_condition: k*xi << 1 with xi=hbar/(m*c_s); equivalently omega <<
      m*c_s^2/hbar
    xi_distinct_from_ell_c: hbar/(cS*m) is the healing length, not ell_c=ell_c
    retained_in_Ls: deferred as a higher-phase term only under k*xi << 1
  deferred_terms:
    phase2_variable_coefficients: rho0(s), c_s(s), V_conf, and background-Q corrections
      if the straight uniform reference is relaxed
    phonon_limit_delta_Q: Bogoliubov k^4 correction parameterized by (k*xi)^2/4
  unsuppressed_operator_intrusion: false
reduced_operator_L_s: (cS**2*Derivative(psi_hat(s), (s, 2)) + omega**2*psi_hat(s))/cS**2
operator_is_helmholtz: true
speed_is_cs: true
domain_is_L0: true
bc_type: D-at-mouth / N-at-cap
bc_provenance: imposed
bc_derivation_emitted: false
dtn: -omega*tan(L0*omega/cS)/cS
pole_ladder: omega_n = pi*cS*(n + 1/2)/L0, n=0,1,2,...
halfshift: true
static_limit_series: -L0*omega**2/cS**2 - L0**3*omega**4/(3*cS**4) + O(omega**6)
round_trip:
  r_D: '-1'
  r_L: r_N=+1
  R_rt_expression: -exp(2*I*L0*omega/cS)
  R_rt_on_pole_ladder: '1'
  R_rt: '1'
  phi0: 0 mod 2*pi
  computed_after_ladder_substitution: true
counterfactual_guard:
  robin_determinant_emitted: true
  recovers_DN_at_alpha0: true
  recovers_DD_at_alpha_inf: true
  halfshift_destroyed_for_DD: true
  numeric_alpha_distinct: true
  dtn_mismatch: true
engine_agreement: true
engine_agreement_details:
  status: pass
  digest_matches: true
  mathematica_yaml: software/stage1_solver/_scratch/pathA_30_mathematica_results.yaml
  details:
    dtn: true
    pole_denominator: true
    robin_dtn: true
    robin_denominator: true
    static_series: true
    dd_limit: true
    alpha0_limit: true
    dimensional_ok: true
    dimension_probe_verdict: true
  dimensional_agreement:
    dimensional_ok: true
    dimension_probe_verdict: true
  mathematica_route: transfer_matrix_resolvent
dim_check: pass
dimensional:
  dimension_order:
  - L
  - M
  - T
  dimensional_gate: sourced EOS speed law plus DtN argument/prefactor
  headline_quantities_walked:
    cs_squared_from_EOS: 5*K*rho_star**4/m
    tan_argument: L0*omega/cS
    Z00: -omega*tan(L0*omega/cS)/cS
    Z00_prefactor_walked: -omega/cS
  symbol_dimensions:
    L0: L
    omega: T^-1
    c_s: L T^-1
    m: M
    energy: L^2 T^-2 M
    four_volume_L4: L^4
    P: L^-2 T^-2 M
    rho_star: L^-4
    K: L^18 T^-2 M
  sourcing_note:
    K_source: P=K*rho^5
    spatial_dimensions: 4
    no_cs_dependency: true
    energy_dimension_LMT:
    - '2'
    - '1'
    - '-2'
    four_volume_dimension_LMT:
    - '4'
    - '0'
    - '0'
    P_dimension_LMT:
    - '-2'
    - '1'
    - '-2'
    rho_dimension_LMT:
    - '-4'
    - '0'
    - '0'
    K_derivation: '[K]=[P]-5[rho]'
    K_dimension_LMT:
    - '18'
    - '1'
    - '-2'
    derived_chain: '[P]=(-2,1,-2), [rho]=(-4,0,0), [K]=[P]-5[rho]=(18,1,-2)'
  computed_dimensions:
    cs_squared_from_EOS: L^2 T^-2
    tan_argument: '1'
    Z00_prefactor: L^-1
  computed_dimension_vectors_LMT:
    cs_squared_from_EOS:
    - '2'
    - '0'
    - '-2'
    tan_argument:
    - '0'
    - '0'
    - '0'
    Z00_prefactor:
    - '-1'
    - '0'
    - '0'
  expected_dimensions:
    cs_squared_from_EOS: L^2 T^-2
    tan_argument: '1'
    Z00_prefactor: L^-1
  dimensional_ok: true
  status: pass
  dimensional_status: DIMENSIONAL_OK
  table:
  - quantity: K
    expression: K
    dimension: L^18 T^-2 M
    dimension_monomial: L**18*M/T**2
    dimension_vector_LMT:
    - '18'
    - '1'
    - '-2'
  - quantity: rho_star
    expression: rho_star
    dimension: L^-4
    dimension_monomial: L**(-4)
    dimension_vector_LMT:
    - '-4'
    - '0'
    - '0'
  - quantity: m
    expression: m
    dimension: M
    dimension_monomial: M
    dimension_vector_LMT:
    - '0'
    - '1'
    - '0'
  - quantity: cs_squared_from_EOS=5*K*rho_star^4/m
    expression: 5*K*rho_star**4/m
    dimension: L^2 T^-2
    dimension_monomial: L**2/T**2
    dimension_vector_LMT:
    - '2'
    - '0'
    - '-2'
  - quantity: omega*L0/c_s
    expression: L0*omega/cS
    dimension: '1'
    dimension_monomial: '1'
    dimension_vector_LMT:
    - '0'
    - '0'
    - '0'
  - quantity: Z00_prefactor=-omega/c_s
    expression: -omega/cS
    dimension: L^-1
    dimension_monomial: 1/L
    dimension_vector_LMT:
    - '-1'
    - '0'
    - '0'
  DN_UNITTEST_FAIL_DIMENSIONAL_probe:
    mutation: corrupt sourced [K] by one extra power of L
    participates_in_verdict: true
    sourced_K_dimension: L^18 T^-2 M
    corrupted_K_dimension: L^19 T^-2 M
    mutated_dimensions:
      cs_squared_from_EOS: L^3 T^-2
      tan_argument: '1'
      Z00_prefactor: L^-1
    without_mutation_dimensional_ok: true
    with_mutation_dimensional_ok: false
    probe_verdict: DN_UNITTEST_FAIL_DIMENSIONAL
    mutation_fires: true
    self_ablation:
      rerun_gate_logic: true
      with_mutation: DN_UNITTEST_FAIL_DIMENSIONAL
      without_mutation: DN_UNITTEST_BC_DEPENDENT
      expected_fail: DN_UNITTEST_FAIL_DIMENSIONAL
      fail_suppressed: true
