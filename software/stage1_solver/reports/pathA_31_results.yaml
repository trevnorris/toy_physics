operator_order:
- ell=0 modal operator + BC + mu_eta inner product
- profiles + projection integrals
- M_AB,K_AB + dynamical EOM M Qddot + K Q = F
- legacy E_geom comparison
modal_operator:
  equation: mu_eta*q_tt - d_w(T_w*d_w q) + K_eta*q = S_0^(psi)+f_0^ext
  L0: mu_eta^(-1)*(-d_w(T_w*d_w .) + K_eta .)
  K_eta: Tw*beta**2
  constant_coeff_assumption: beta=sqrt(K_eta/T_w) is scalar only on this straight
    constant-coefficient reference
  collective_BC:
    alpha_a: alpha_a(0)=1, alpha_a(L0)=0
    alpha_L: alpha_L(0)=0, alpha_L(L0)=rAL
  g_lane_BC: g(0)=0, T_w*g'(L0)=0
  inner_product: <f,g>_mu=4*pi*int_0^L0 mu_eta f g dw
  self_adjoint_g_lane: true
profiles:
  alpha_a: sinh(L0*beta - beta*w)/sinh(L0*beta)
  alpha_L: rAL*sinh(beta*w)/sinh(L0*beta)
  dsolve_general: C1*sinh(beta*w) + C2*cosh(beta*w)
  provenance: derived
  residuals_and_BC:
    L0_alpha_a: '0'
    L0_alpha_L: '0'
    alpha_a_mouth: '1'
    alpha_a_cap: '0'
    alpha_L_mouth: '0'
    alpha_L_cap: rAL
structure:
  M_posdef: true
  M_leading_minor_positive: true
  M_det_positive: true
  K_symmetric: true
  K_structure_ok: true
  K_offdiag_negative: true
  K_rank: 2
  K_rank_matches_legacy: true
  K_zero_pattern_matches_legacy: true
  K_zero_pattern:
  - - false
    - false
  - - false
    - false
  structure_from_computed_matrices: true
  structure_counterfactual:
    non_posdef_M_probe:
      mutation: M_aa -> -M_aa
      M_posdef: false
      leading_minor_positive: false
      det_positive: false
    sign_flipped_K_probe:
      mutation: K_aL -> -K_aL
      K_offdiag_negative: false
      K_structure_ok: false
  structure_certificates:
    M_aa_positive: M_aa=2*pi*muEta*(sinh(B)*cosh(B)-B)/(beta*sinh(B)^2)>0 for B=L0*beta>0
    M_det_positive: det(M)=4*pi^2*muEta^2*rAL^2*(sinh(B)^2-B^2)/(beta^2*sinh(B)^2)>0
      for B=L0*beta>0
    K_aL_negative: K_aL=-4*pi*Tw*beta*rAL/sinh(B)<0 for B=L0*beta>0
  legacy_E_geom: 1/2*kappa*(delta_L-chi*delta_a)^2 + 1/2*sigmaA*delta_a^2 + 1/2*sigmaL*delta_L^2
  legacy_Hessian:
    aa: chi**2*kappa + sigmaA
    aL: -chi*kappa
    LL: kappa + sigmaL
  legacy_rank: 2
  legacy_zero_pattern:
  - - false
    - false
  - - false
    - false
  legacy_symmetric: true
  legacy_offdiag_negative: true
  legacy_pattern: symmetric full-rank ratio-plus-support Hessian with negative off-diagonal
    for chi>0
  full_matrix_fit: false
hf_force:
  hf_force_reduces: true
  measure: action measure 4*pi*int dw; not mu_eta-weighted
  distributed_route:
    unsimplified:
      F_a: 4*pi*Integral(Vp0*rhoStar*sinh(L0*beta - beta*w)/(ellC*sinh(L0*beta)),
        (w, 0, L0))
      F_L: 4*pi*Integral(Vp0*rAL*rhoStar*sinh(beta*w)/(ellC*sinh(L0*beta)), (w, 0,
        L0))
    simplified:
      F_a: 4*pi*Vp0*rhoStar*(cosh(L0*beta) - 1)/(beta*ellC*sinh(L0*beta))
      F_L: 4*pi*Vp0*rAL*rhoStar*(cosh(L0*beta) - 1)/(beta*ellC*sinh(L0*beta))
    method: functional wall-force density projected against alpha_A with the action
      measure
  legacy_route:
    unsimplified:
      F_a: -4*pi*Integral(-Vp0*rhoStar*sinh(L0*beta - beta*w)/(ellC*sinh(L0*beta)),
        (w, 0, L0))
      F_L: -4*pi*Integral(-Vp0*rAL*rhoStar*sinh(beta*w)/(ellC*sinh(L0*beta)), (w,
        0, L0))
    simplified:
      F_a: 4*pi*Vp0*rhoStar*(cosh(L0*beta) - 1)/(beta*ellC*sinh(L0*beta))
      F_L: 4*pi*Vp0*rAL*rhoStar*(cosh(L0*beta) - 1)/(beta*ellC*sinh(L0*beta))
    method: direct parametric derivative of V_conf(r,w;a,L) before integration
  differences:
    F_a: '0'
    F_L: '0'
  unsimplified_routes_identical: false
  chain_rule_identity_used: false
dynamical_EOM:
  matrix_form: M_AB*Qddot^B + K_AB*Q^B = F_A^(HF)
  expanded:
  - M_aa*delta_a_ddot + M_aL*delta_L_ddot + K_aa*delta_a + K_aL*delta_L = F_a
  - M_aL*delta_a_ddot + M_LL*delta_L_ddot + K_aL*delta_a + K_LL*delta_L = F_L
  Q: (delta_a, delta_L)
  Qddot_present: true
  K_AB_provenance: operator_projection_not_static_Hessian
static_dynamic_consistency:
  static_limit_consistent: true
  limit: Qddot -> 0 in the same M_AB Qddot + K_AB Q = F_A system gives K_AB Q = F_A;
    after the legacy pattern comparison this is the static dE_geom/dQ=0 limit.
  separate_static_solve: false
calibration_inputs:
- muEta
- Tw
- K_eta/Tw beta scale
- legacy kappa/chi/sigmaA/sigmaL magnitudes
