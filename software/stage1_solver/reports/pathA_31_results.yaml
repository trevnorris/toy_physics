    Y00: 1/(2*sqrt(pi)); int_S2 Y00^2 dOmega = 1
    eta: eta(w,t)=eta_00(w,t)*Y00
    T_Omega_term: drops because l(l+1)=0
  background:
    gate1_reference: straight constant-coefficient finite throat, rho0=rho_star
    R0_endpoint_data: R0(0)=a0, R0(L0)=0; frozen Gate-1 packet has L0=37/20 and Tw=K_eta=1
    domain: 0 <= w <= L0
    rho0: rhoStar
  source_linearization:
    Sigma: r-R0(w)-eta
    delta_V_conf: -(V_wall_prime_0/ell_c)*eta
    action_force_density: rhoStar*V_wall_prime_0/ellC, conjugate to eta
    action_measure: int f_Sigma alpha_A sqrt(gamma0) dw dOmega; straight-reference
      normalization gives 4*pi int dw, not the mu_eta inner product
  input_provenance:
    alpha_a: 'derived: harmonic lifting L0 alpha_a=0 with alpha_a(0)=1, alpha_a(L0)=0
      from Gate-1 endpoint data'
    alpha_L: 'derived: harmonic lifting L0 alpha_L=0 with alpha_L(0)=0, alpha_L(L0)=rAL
      from straight-throat length endpoint data'
    muEta: calibration
    Tw: calibration
    K_eta: calibration_tied_to_beta_squared_Tw
    beta_from_R0: beta=sqrt(K_eta/Tw)=1 from frozen constant-coefficient packet; geometry
      alone does not derive it
  phonon_limit_caveat: No BdG k^4 matter-sector term enters this gate; Gate-1 caveat
    remains deferred under k*xi << 1 if matter dynamics are restored.
  forbidden_fit_flags:
    K_from_static_hessian: false
    M_or_K_typed_from_legacy_values: false
    full_matrix_fit: false
    chain_rule_HF_identity_used: false
    counterfactual_flags_hardcoded: false
