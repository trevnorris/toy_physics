    21c: -sqrt(15)*(-sin(phi - 2*theta) + sin(phi + 2*theta))/(8*sqrt(pi))
    21s: sqrt(15)*(-cos(phi - 2*theta) + cos(phi + 2*theta))/(8*sqrt(pi))
    22c: sqrt(15)*sin(theta)**2*cos(2*phi)/(4*sqrt(pi))
    22s: sqrt(15)*sin(2*phi)*sin(theta)**2/(4*sqrt(pi))
