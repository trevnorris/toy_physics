schema: pathA_33_quadrupole_normalization/v1
engine: dual-engine
source_directive: software/stage1_solver/directives/pathA_33_quadrupole_normalization.md
cited_sources:
- research/pde_ledger/notes/stages/moving_throat_pde_handoff_full.md sections 10.3,
  11, 12
- software/stage1_solver/reports/pathA_22a_dimensional_skeleton.md
verdict: QUAD_CALIBRATED
which_rung: QUAD_CALIBRATED
gate_booleans:
  fingerprint_ok: true
  prefactor_ok: true
  scaling_ok: true
  equivalence_ok: true
  dimensional_ok: true
  outgoing_ok: true
  provenance_ok: true
  able_to_fail_ok: true
dtn_fingerprint:
  definition:
    Lambda2_out: z*h2^(1)'(z)/h2^(1)(z)
    Yhat2_out: -3/Lambda2_out
    z: a*omega/c_s
  sympy:
    lambda_out_series_z: -(2*z**6 - 3*I*z**5 - 3*z**4 - 9*z**2 + 81)/27
    Yhat_out_series_z: -(11*z**6 - 27*I*z**5 - 36*z**4 - 81*z**2 - 729)/729
    coefficients_z:
      u2: 1/9
      u4: 4/81
      v5: 1/27
    coefficients_physical:
      u2: a**2/(9*c_s**2)
      u4: 4*a**4/(81*c_s**4)
      v5: a**5/(27*c_s**5)
    coefficients_z_numeric:
      u2: 0.1111111111111111
      u4: 0.04938271604938271
      v5: 0.037037037037037035
    coefficient_matches:
      u2_z: true
      u4_z: true
      v5_z: true
      u2: true
      u4: true
      v5: true
    chi_Q: '1'
    chi_Q_numeric: 1.0
    incoming_chi_Q: '-1'
    incoming_chi_Q_numeric: -1.0
    standing_lambda_static: '2'
    standing_Yhat_static: -3/2
    standing_v5_z: '0'
  mathematica:
    lambda_out_series_z: -3 + z^2/3 + z^4/9 + (I/9)*z^5 - (2*z^6)/27
    Yhat_out_series_z: 1 + z^2/9 + (4*z^4)/81 + (I/27)*z^5 - (11*z^6)/729
    coefficients_z:
      u2: 1/9
      u4: 4/81
      v5: 1/27
    coefficients_physical:
      u2: a^2/(9*cs^2)
      u4: (4*a^4)/(81*cs^4)
      v5: a^5/(27*cs^5)
    coefficients_z_numeric:
      u2: 0.1111111111111111
      u4: 0.04938271604938271
      v5: 0.037037037037037035
    coefficient_matches:
      u2_z: true
      u4_z: true
      v5_z: true
    chi_Q: '1'
    chi_Q_numeric: 1.0
    incoming_chi_Q: '-1'
    incoming_chi_Q_numeric: -1.0
    standing_lambda_static: '2'
    standing_Yhat_static: -3/2
    standing_v5_z: '0'
  derived_coefficients:
    u2: a**2/(9*c_s**2)
    u4: 4*a**4/(81*c_s**4)
    v5: a**5/(27*c_s**5)
    chi_Q: '1'
outgoing_port_moments:
  P_port: Omega_U**2*g_W + R*g_U
  N_A0_r: (Omega_U**2*g_W + R*g_U)**2/Delta**2
  N_A2_r: -2*(Omega_U**2*g_W + R*g_U)*(Delta*g_W - Omega_U**2*S*g_W - R*S*g_U)/Delta**3
  N_A4_r: (Delta**2*g_W**2 - 2*Delta*Omega_U**4*g_W**2 - 4*Delta*Omega_U**2*R*g_U*g_W
    - 4*Delta*Omega_U**2*S*g_W**2 - 2*Delta*R**2*g_U**2 - 4*Delta*R*S*g_U*g_W + 3*Omega_U**4*S**2*g_W**2
    + 6*Omega_U**2*R*S**2*g_U*g_W + 3*R**2*S**2*g_U**2)/Delta**4
  isotropic_branch: N_20,n=N_21,n=N_22,n=N_n and D_20,n=D_21,n=D_22,n=D_n carried
    symbolically
prefactor_algebra:
  definition: P(omega)=D0*N(omega)/Dcons(omega)^2
  Nomega: N0 + N2*omega**2 + N4*omega**4
  Dcons: D0 + D2*omega**2 + D4*omega**4
  correct_series: (D0**2*N0 + D0**2*N2*omega**2 + D0**2*N4*omega**4 - 2*D0*D2*N0*omega**2
    - 2*D0*D2*N2*omega**4 - 2*D0*D4*N0*omega**4 + 3*D2**2*N0*omega**4)/D0**3
  coefficients:
    P0: N0/D0
    P2: (D0*N2 - 2*D2*N0)/D0**2
    P4: (D0**2*N4 - 2*D0*D2*N2 - 2*D0*D4*N0 + 3*D2**2*N0)/D0**3
  expected:
    P0: N0/D0
    P2: (D0*N2 - 2*D2*N0)/D0**2
    P4: (D0**2*N4 - 2*D0*D2*N2 - 2*D0*D4*N0 + 3*D2**2*N0)/D0**3
  residuals_to_formula:
    P0: '0'
    P2: '0'
    P4: '0'
  matches:
    P0: true
    P2: true
    P4: true
  N_over_D_self_check:
    correct_P2_D2N0_term: -2*D2*N0
    plain_P2_D2N0_term: -D2*N0
    plain_equals_correct_P2: false
    difference_plain_minus_correct_P2: D2*N0/D0**2
  plain_N_over_D_coefficients:
    P0: N0/D0
    P2: (D0*N2 - D2*N0)/D0**2
    P4: (D0**2*N4 - D0*D2*N2 - D0*D4*N0 + D2**2*N0)/D0**3
  sympy_sample_values:
    P0: 0.5789473684210527
    P2: -0.7174515235457064
    P4: 0.016037323224959543
    plain_P2: -0.016620498614958512
    plain_minus_correct_P2: 0.7008310249307479
  mathematica_sample_values:
    P0: 0.5789473684210527
    P2: -0.7174515235457064
    P4: 0.016037323224959908
    plain_P2: -0.01662049861495845
    plain_minus_correct_P2: 0.700831024930748
target_scaling:
  target_rhs: 54*G*c_s**5/(5*a**5*c**5)
  P0_target_scaling: -5
  target_scaling_ok: true
  actual_branch_scaling_status: DEFERRED_GATE_6_SYMBOLIC_Dn_Nn_NO_A_SCALINGS_SUPPLIED
  wrong_scaling_probe_power: -4
  wrong_scaling_probe_ok: true
equivalence:
  definitions:
    P0_physical: N0*c_s**2/(D0*a**2)
    Gamma5: N0*a**3*chi_Q/(27*D0*c_s**3)
    gamma_quad_eff: mhat0^2*Gamma5 with mhat0=mu_hat0*mtilde0
    normalization_target: 54*G*c_s**5/(5*a**5*c**5)
  chi_Q_derived_from_DtN: '1'
  Gamma5_with_derived_chi: N0*a**3/(27*D0*c_s**3)
  forward_residual_to_2G_over_5c5: '0'
  reverse_residual_to_54Gcs5_over_5a5c5: '0'
  ok: true
  wrong_gamma_probe_residual: 27*G*c_s**5/(5*a**5*c**5)
  wrong_gamma_probe_fires: true
dimensional_check:
  dimension_order:
  - L
  - M
  - T
  dimensional_gate: mu_hat0-free P0 physical dimension check
  dimensional_gate_expression: P0_phys=(c_s/a)^2*(N0/D0)
  dimensional_gate_depends_on_mu_hat0: false
  symbol_dimensions:
    a: L
    c_s: L T^-1
    c: L T^-1
    G: L^3 T^-2 M^-1
    N0: L^-1 M
    D0: L^-1 T^-2 M
    mtilde0: '1'
    mu_hat0: L^-1 T^-1 M^-1/2
  P0_raw_dimension: T^2
  frequency_normalization_dimension: T^-2
  P0_dimension: '1'
  P0_physical_dimension: '1'
  P0_physical_dimension_vector_LMT:
  - '0'
  - '0'
  - '0'
  dimensional_ok: true
  dimensional_status: DIMENSIONAL_OK
  mu_hat0_dimension: L^-1 T^-1 M^-1/2
  Gamma5_dimension: T^5
  lhs_dimension: L^-2 T^-2 M^-1
  rhs_dimension: L^-2 T^-2 M^-1
  table:
  - quantity: N0
    expression: N0
    dimension: L^-1 M
    dimension_monomial: M/L
    dimension_vector_LMT:
    - -1
    - 1
    - 0
  - quantity: D0
    expression: D0
    dimension: L^-1 T^-2 M
    dimension_monomial: M/(L*T**2)
    dimension_vector_LMT:
    - -1
    - 1
    - -2
  - quantity: P0_raw=N0/D0
    expression: N0/D0
    dimension: T^2
    dimension_monomial: T**2
    dimension_vector_LMT:
    - '0'
    - '0'
    - '2'
  - quantity: frequency_normalization=(c_s/a)^2
    expression: c_s**2/a**2
    dimension: T^-2
    dimension_monomial: T**(-2)
    dimension_vector_LMT:
    - '0'
    - '0'
    - '-2'
  - quantity: P0=(c_s/a)^2*N0/D0
    expression: N0*c_s**2/(D0*a**2)
    dimension: '1'
    dimension_monomial: '1'
    dimension_vector_LMT:
    - '0'
    - '0'
    - '0'
  - quantity: Yhat_out_physical_expansion
    expression: I*(3*a**5*omega**5 - 4*I*a**4*c_s*omega**4 - 9*I*a**2*c_s**3*omega**2
      - 81*I*c_s**5)/(81*c_s**5)
    dimension: '1'
    dimension_monomial: '1'
    dimension_vector_LMT:
    - '0'
    - '0'
    - '0'
  - quantity: Gamma5=chi_Q*P0*a^5/(27*c_s^5)
    expression: N0*a**3*chi_Q/(27*D0*c_s**3)
    dimension: T^5
    dimension_monomial: T**5
    dimension_vector_LMT:
    - '0'
    - '0'
    - '5'
  - quantity: target_lhs=(mu_hat0*mtilde0)^2*P0
    expression: N0*c_s**2*mtilde0**2*mu_hat0**2/(D0*a**2)
    dimension: L^-2 T^-2 M^-1
    dimension_monomial: 1/(L**2*M*T**2)
    dimension_vector_LMT:
    - '-2'
    - '-1'
    - '-2'
  - quantity: target_rhs=54*G*c_s^5/(5*a^5*c^5)
    expression: 54*G*c_s**5/(5*a**5*c**5)
    dimension: L^-2 T^-2 M^-1
    dimension_monomial: 1/(L**2*M*T**2)
    dimension_vector_LMT:
    - '-2'
    - '-1'
    - '-2'
  mu_hat0_homogeneity_diagnostic:
    label: non-able-to-fail (mu_hat0 free carrier)
    participates_in_verdict: false
    mu_dim_solved_from_rhs_minus_p0_over_2: true
    homogeneity_required_P0_dimension_with_pinned_mu: '1'
    mu_hat0_dimension: L^-1 T^-1 M^-1/2
    lhs_dimension: L^-2 T^-2 M^-1
    rhs_dimension: L^-2 T^-2 M^-1
    lhs_raw_without_frequency_normalization_dimension: L^-2 M^-1
    homogeneity_pass: true
  mutation_drop_frequency_normalization:
    mutated_P0_expression: N0/D0
    mutated_P0_dimension: T^2
    mutated_P0_dimension_vector_LMT:
    - '0'
    - '0'
    - '2'
    baseline_P0_physical_dimension: '1'
    dimensional_ok: false
    verdict: FAIL_DIMENSIONAL
    mutation_fires: true
  mutation_corrupt_N0_dimension:
    sourced_N0_dimension: L^-1 M
    corrupted_N0_dimension: '1'
    mutated_P0_raw_dimension: L T^2 M^-1
    mutated_P0_physical_dimension: L M^-1
    mutated_P0_physical_dimension_vector_LMT:
    - '1'
    - '-1'
    - '0'
    baseline_P0_physical_dimension: '1'
    dimensional_ok: false
    verdict: FAIL_DIMENSIONAL
    mutation_fires: true
