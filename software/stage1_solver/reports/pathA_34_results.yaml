    linearized_constraint_expressions:
    - (Omega_U**2*g_W + R_mix*g_U)**2/(D0*(Omega_U*Omega_W - R_mix)**2*(Omega_U*Omega_W
      + R_mix)**2)
    - K0c
    - K_eta + 2*T_Omega
    linearized_constraint_matrix:
    - - -4*Omega_U*R_mix*(Omega_U**2*g_W + R_mix*g_U)*(Omega_W**2*g_U + R_mix*g_W)/(D0*(Omega_U*Omega_W
        - R_mix)**3*(Omega_U*Omega_W + R_mix)**3)
      - -4*Omega_U**2*Omega_W*(Omega_U**2*g_W + R_mix*g_U)**2/(D0*(Omega_U*Omega_W
