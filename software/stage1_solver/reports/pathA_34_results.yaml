      - 2*R_mix*(Omega_U**2*g_W + R_mix*g_U)/(D0*(Omega_U*Omega_W - R_mix)**2*(Omega_U*Omega_W
        + R_mix)**2)
      - 2*Omega_U**2*(Omega_U**2*g_W + R_mix*g_U)/(D0*(Omega_U*Omega_W - R_mix)**2*(Omega_U*Omega_W
        + R_mix)**2)
      - -(Omega_U**2*g_W + R_mix*g_U)**2/(D0**2*(Omega_U*Omega_W - R_mix)**2*(Omega_U*Omega_W
        + R_mix)**2)
      - '0'
