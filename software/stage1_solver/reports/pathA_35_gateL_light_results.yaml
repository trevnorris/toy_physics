configurations:
  A_baseline:
    config_verdict: FAIL_COUPLE_STRESS_NOGO
    labels_fired:
    - FAIL_HIDDEN_PROPAGATING_MODE
    - FAIL_C5_LONGITUDINAL_ZERO_MODE
    - FAIL_NOT_BOUNDED_BELOW
    sub_hurdle_status:
      L_a_i: PASS
      L_a_ii: FAIL
      L_a_iii: FAIL
      L_b: FAIL
      L_c: PASS
      L_d: PASS
    traction_provenance: ARROWS_SUPPLY_TRACTION
    extra_propagating_modes: 3
    dispersion:
      P_spin_omega2: c_s^2 k^2
      coupled_transverse_pencil: det[[mu_R k^2-rho_br omega^2, lambda_Pu k],[lambda_Pu k, Gamma_P k^2-J_P omega^2]]=0
      small_k_warning: derived Hamiltonian minor gives two negative omega^2 transverse branches at low k for nonzero lambda_Pu;
        counted separately in L(b)
      u_light_omega2_uncoupled_reference: (mu_R/rho_br) k^2
    section_2_6_chain_role: 'live_P_horn: massless P supplies the needed reservoir candidate but creates hidden modes and
      an unbounded gyroscopic P-u Hamiltonian; no phi leaves C5 exposed'
  B_slaved_rigid:
    config_verdict: FAIL_C5_LONGITUDINAL_ZERO_MODE
    labels_fired:
    - FAIL_C5_LONGITUDINAL_ZERO_MODE
    sub_hurdle_status:
      L_a_i: PASS
      L_a_ii: PASS_WITH_LOW_K_DISPERSION_CAVEAT
      L_a_iii: FAIL
      L_b: PASS_CONDITIONAL_ON_POSITIVE_EFFECTIVE_MODULUS
      L_c: PASS
      L_d: PASS
    traction_provenance: POSTULATED_SURFACE_ELASTICITY
    extra_propagating_modes: 0
    dispersion:
      c_gamma_squared_MacCullagh_feed_forward: mu_R/rho_br
      effective_c_squared_if_bilinear_retained: (mu_R - 2 lambda_Pu)/rho_br
      k4_correction: (Gamma_P/rho_br) k^4
      k_disp_squared: (mu_R - 2 lambda_Pu)/Gamma_P
      low_k_tolerance: requires k^2 << (mu_R - 2 lambda_Pu)/Gamma_P with positive effective modulus; exact nondispersive equality
        is false at finite k
      omega2_slaved: ((mu_R - 2 lambda_Pu) k^2 + Gamma_P k^4)/rho_br
      symbolic_checks:
        k_disp_squared: -(2*lambda_Pu - mu_R)/Gamma_P
        omega2_identity: true
    section_2_6_chain_role: slaved-rigid escape resolves hidden P mode-count and closure with a derived k^4 correction, but
      inherits the frozen no-phi C5 zero mode; phi=u_w rescue collides with L(d)
