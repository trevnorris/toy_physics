      secondary_preservation_no_multiplier: J*k**3*rho_B0**3*u_L/(chi_c*rho_br)
      first_class_count: 0
      second_class_count: 2
      classification: SECOND_CLASS_PAIR
    gauge:
      closure: BROKEN_OFF_LOCUS
      square_residual_K_minus_CJ2_over_rho: -(J**2*rho_B0**2 + kappa_phase*rho_br)/rho_br
      B_eff_required_zero: false
      theta_mass_required_zero: true
      generator: null
    hamiltonian:
      canonical_H: p_u_L^2/(2 rho_br) + 1/2 B_eff k^2 u_L^2 - 1/2 (K_theta k^2 - m_theta^2) theta^2
      reduced_kinetic_A: (J**2*rho_B0**2 + kappa_phase*rho_br)/kappa_phase
      bounded: true
      status: bounded_reduced_Hamiltonian
    dispersion:
      determinant: k**2*(-J**2*chi_c*omega**2*rho_B0**2 - chi_c*kappa_phase*omega**2*rho_br + k**2*kappa_phase*rho_B0**2)/chi_c
      omega2: k**2*kappa_phase*rho_B0**2/(chi_c*(J**2*rho_B0**2 + kappa_phase*rho_br))
      pole_count: 1
      pole_residue_sign: positive
    mode_count:
      physical_dof_per_finite_k: 1
      independent_initial_data_functions_per_k: 2
    verdict: FAIL_CAUCHY_STRAY_LONGITUDINAL
  branch_a_no_continuity_second_medium_ablation:
    name: decoupled_theta_independent_density_no_continuity
    primitive_lagrangian: 1/2 rho_br dot_u_L^2 + 1/2 chi_c J^2 dot_theta^2 - 1/2 kappa_phase k^2 theta^2
    hessian_rank: 2
    constraints:
      first_class_count: 0
      second_class_count: 0
      classification: TWO_UNCONSTRAINED_SECOND_ORDER_FIELDS
    dispersion:
      u_L: omega^2 = 0
      theta: omega^2 = k**2*kappa_phase/(J**2*chi_c)
      pole_count: 2
      pole_residue_sign: positive
    mode_count:
      physical_dof_per_finite_k: 2
      independent_initial_data_functions_per_k: 4
    verdict: FAIL_EXTRA_SCALAR_DOF
  epsilon_mismatch_control:
    name: epsilon_mismatch_square_closes_wrong_inertia
    primitive_lagrangian: 1/2 (2 rho_br) dot_u_L^2 - C_J k u_L dot_theta + 1/2 (C_J^2/(2 rho_br)) k^2 theta^2
    constraints:
      primary: -J*k*rho_B0*u_L + pi_theta
      secondary: J*k*rho_B0*(J*k*rho_B0*theta - p_u_L)/(2*rho_br)
      constraint_bracket: '0'
      first_class_count: 2
      second_class_count: 0
      classification: FIRST_CLASS_LONGITUDINAL_BUT_WRONG_EPSILON
    longitudinal_square:
      epsilon: 2*rho_br
      closes: true
      physical_dof_per_finite_k: 0
    transverse_check:
      frozen_omega2: k**2*mu_R/rho_br
      mismatched_omega2: k**2*mu_R/(2*rho_br)
      speed_shift: -k**2*mu_R/(2*rho_br)
    mode_count:
