    name: branch_b_slaved_tuned_Maxwell_locus
    primitive_lagrangian: 1/2 rho_br dot_u_L^2 - C_J k u_L dot_theta + 1/2 (K_theta k^2 - m_theta^2) theta^2 - 1/2 B_eff k^2
