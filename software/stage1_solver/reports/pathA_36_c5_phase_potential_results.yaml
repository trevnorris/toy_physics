      secondary: J*k*rho_B0*(J*k*rho_B0*theta - p_u_L)/rho_br
      constraint_bracket: '0'
      secondary_preservation_no_multiplier: '0'
      first_class_count: 2
      second_class_count: 0
      classification: FIRST_CLASS_MAXWELL_CHAIN
    gauge:
      closure: OFF_SHELL_ALL_K_LOCAL
      square_residual_K_minus_CJ2_over_rho: '0'
      B_eff_required_zero: true
      theta_mass_required_zero: true
      generator:
        generator: G[chi]=(rho_br/C_J)*(chi*Phi_2-dot(chi)*Phi_1)
        delta_u_L: k chi
        delta_theta: -(rho_br/C_J) dot(chi)
        local: true
        inverse_k_or_inverse_omega: false
    hamiltonian:
