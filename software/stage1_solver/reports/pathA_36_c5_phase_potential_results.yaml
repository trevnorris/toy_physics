dimensional_firewall:
  pass: true
  checked_expression_count: 18
  ablations:
  - category: ablation
    name: drop_rho_B0_from_Josephson_cross
    expression: J partial_t u dot nabla theta
    actual:
      triple_MLT:
      - 0
      - 2
      - -2
      string: L^2 T^-2
    expected:
      triple_MLT:
      - 1
      - -1
      - -2
      string: M L^-1 T^-2
    status: FIRED
  - category: ablation
    name: phase_stiffness_without_gradient
    expression: K_theta theta^2
    actual:
      triple_MLT:
      - 1
      - 1
      - -2
      string: M L T^-2
    expected:
      triple_MLT:
      - 1
      - -1
      - -2
      string: M L^-1 T^-2
