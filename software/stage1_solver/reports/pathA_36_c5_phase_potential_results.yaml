per_branch_sub_results:
  branch_b_slaved_curl_only_conventional_K:
    name: branch_b_slaved_curl_only_conventional_K
    primitive_lagrangian: 1/2 rho_br dot_u_L^2 - C_J k u_L dot_theta + 1/2 (K_theta k^2 - m_theta^2) theta^2 - 1/2 B_eff k^2
      u_L^2
    coefficients:
      C_J: -J*rho_B0
      K_theta: -kappa_phase
      B_eff: '0'
      theta_mass2: '0'
      S_theta: -k**2*kappa_phase
    momenta:
      p_u_L: dot_u_L*rho_br
      pi_theta: J*k*rho_B0*u_L
    constraints:
      primary: -J*k*rho_B0*u_L + pi_theta
      secondary: -k*(J*p_u_L*rho_B0 + k*kappa_phase*rho_br*theta)/rho_br
      constraint_bracket: k**2*(J**2*rho_B0**2 + kappa_phase*rho_br)/rho_br
      secondary_preservation_no_multiplier: '0'
      first_class_count: 0
      second_class_count: 2
      classification: SECOND_CLASS_PAIR
    gauge:
      closure: BROKEN_OFF_LOCUS
      square_residual_K_minus_CJ2_over_rho: -(J**2*rho_B0**2 + kappa_phase*rho_br)/rho_br
      B_eff_required_zero: true
      theta_mass_required_zero: true
      generator: null
    hamiltonian:
      canonical_H: p_u_L^2/(2 rho_br) + 1/2 B_eff k^2 u_L^2 - 1/2 (K_theta k^2 - m_theta^2) theta^2
      reduced_kinetic_A: (J**2*rho_B0**2 + kappa_phase*rho_br)/kappa_phase
      bounded: true
      status: bounded_reduced_Hamiltonian
    dispersion:
      determinant: -k**2*omega**2*(J**2*rho_B0**2 + kappa_phase*rho_br)
      omega2: '0'
      pole_count: 1
      pole_residue_sign: positive
    mode_count:
      physical_dof_per_finite_k: 1
      independent_initial_data_functions_per_k: 2
    verdict: FAIL_C5_LONGITUDINAL_ZERO_MODE
  branch_b_slaved_finite_compressibility_conventional_K:
    name: branch_b_slaved_finite_compressibility_conventional_K
    primitive_lagrangian: 1/2 rho_br dot_u_L^2 - C_J k u_L dot_theta + 1/2 (K_theta k^2 - m_theta^2) theta^2 - 1/2 B_eff k^2
      u_L^2
    coefficients:
      C_J: -J*rho_B0
      K_theta: -kappa_phase
      B_eff: rho_B0**2/chi_c
      theta_mass2: '0'
      S_theta: -k**2*kappa_phase
    momenta:
      p_u_L: dot_u_L*rho_br
      pi_theta: J*k*rho_B0*u_L
    constraints:
      primary: -J*k*rho_B0*u_L + pi_theta
      secondary: -k*(J*p_u_L*rho_B0 + k*kappa_phase*rho_br*theta)/rho_br
      constraint_bracket: k**2*(J**2*rho_B0**2 + kappa_phase*rho_br)/rho_br
      secondary_preservation_no_multiplier: J*k**3*rho_B0**3*u_L/(chi_c*rho_br)
      first_class_count: 0
      second_class_count: 2
      classification: SECOND_CLASS_PAIR
    gauge:
      closure: BROKEN_OFF_LOCUS
