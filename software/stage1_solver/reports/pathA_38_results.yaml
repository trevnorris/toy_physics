schema: pathA_38_throat_body_electric_sympy/v2
top_line_verdict: THROAT_ELECTRIC_LOCALIZED_COULOMB
honest_scope:
  premise: conditional reduced Z2-wall model with an unpinned self-localizing translation Goldstone
  derived:
  - transverse eigenproblem O f_n=m_n^2 K_parallel f_n for the wall modes
  - normalizability from the computed integral int f0^T K_parallel f0 dw
  - static and finite-omega radial factors seeded by the computed m0^2=0 transverse mode
  - charge, anti-charge, gravity-even, and orthogonal-source projections from explicit integrals
  computed_fail_witnesses:
  - delocalized anti-localizing norm divergence and continuum p=3
  - flipped K_parallel ghost norm and wrong-sign U++
  - orthogonalized source with computed zero monopole
  - pathA_35-style confinement curvature with positive descendant mass
  - source-only tau channel Yukawa tail
  calibrated_or_deferred:
  - Q_E magnitude
  - replacement of the compact top-hat datum by a full nonlinear throat-mouth source
  - operator parity mixing from nonlinear throat-induced deltaO
model:
  fields:
  - eta
  - n
  - tau
  background:
    Phi0:
    - tanh(w/ell)
    - tanh(w/ell)
    - '0'
    potential: (chi^2-1)^2/(2*ell^2)+(N^2-1)^2/(2*ell^2)+lamN*(N-chi)^2/2+lamTau*tau^2/2
    background_eom_residual:
    - - '0'
    - - '0'
    - - '0'
  K_w:
  - - '1'
    - '0'
    - '0'
  - - '0'
    - '1'
    - '0'
  - - '0'
    - '0'
    - '1'
  K_parallel:
  - - '1'
    - '0'
    - '0'
  - - '0'
    - '1'
    - '0'
  - - '0'
    - '0'
    - '1'
  M2:
  - - (ell**2*lamN + 6*tanh(w/ell)**2 - 2)/ell**2
    - -lamN
    - '0'
  - - -lamN
    - (ell**2*lamN + 6*tanh(w/ell)**2 - 2)/ell**2
    - '0'
  - - '0'
    - '0'
    - lamTau
  operator: O=-partial_w(K_w partial_w)+M2(w)
  parity_matrix:
  - - '-1'
    - '0'
    - '0'
  - - '0'
    - '-1'
    - '0'
  - - '0'
    - '0'
    - '1'
transverse_mode_spectrum:
  eigenproblem: O f_n=m_n^2 K_parallel f_n
  modes:
  - name: translation_goldstone
    vector: '[sech(w/ell)^2/ell, sech(w/ell)^2/ell, 0]'
    m_squared: '0'
    normalizable: true
    operator_residual:
    - - '0'
    - - '0'
    - - '0'
  - name: wall_shape_partner
    vector: '[sech(w/ell)*tanh(w/ell), sech(w/ell)*tanh(w/ell), 0]'
    m_squared: 3/ell**2
    operator_residual_after_subtracting_eigenvalue:
    - - '0'
    - - '0'
    - - '0'
  - name: relative_lock_partner
    vector: '[sech(w/ell)^2/ell,-sech(w/ell)^2/ell,0]'
    m_squared: 2*lamN
    operator_residual_after_subtracting_eigenvalue:
    - - '0'
    - - '0'
    - - '0'
  - name: tau_source_tilt
    m_squared: lamTau
    operator_residual_after_subtracting_eigenvalue:
    - - '0'
    - - '0'
    - - '0'
  continuum_threshold_eta_n: 4/ell**2
  spectrum_class: normalizable_zero_mode_plus_gap
goldstone:
  f0:
  - - 1/(ell*cosh(w/ell)**2)
  - - 1/(ell*cosh(w/ell)**2)
  - - '0'
  operator_residual:
  - - '0'
  - - '0'
  - - '0'
  bc_residuals:
    parity_wall_eta_prime_0: '0'
    outer_flux_finite_cutoff: -2*sinh(d/ell)/(ell**2*cosh(d/ell)**3)
    outer_flux_noncompact_limit: '0'
  N0_norm_integrand: 2/(ell**2*cosh(w/ell)**4)
  N0_norm_transform_y_density: -2*(y - 1)*(y + 1)/ell
  N0_norm_cutoff: -4*(tanh(d/ell)**2 - 3)*tanh(d/ell)/(3*ell)
  N0_norm: 8/(3*ell)
  shape_norm_transform_y_density: 2*ell*y**2
  shape_norm: 4*ell/3
  m_desc_Z2_squared: '0'
  descendant_numerator_density: '0'
  descendant_numerator_cutoff: '0'
  locking_energy:
    N0prime_over_chi0prime: '1'
    goldstone_normal_lock_residual: '0'
    goldstone_tau_residual: '0'
    flat_direction: true
source_projections:
  rho_a: compact normalized 3D source, int d^3x rho_a=1
  rho_b: top-hat 1/(2*b) for |w|<=b
  u_E_plus: '[1,1,0]'
  u_E_minus: '[-1,-1,0]'
  q_h_plus_density_y: QE/b
  q_h_minus_density_y: -QE/b
  q_h_plus: 2*QE*tanh(b/ell)/b
  q_h_minus: -2*QE*tanh(b/ell)/b
  q_eff: 2*QE*tanh(b/ell)/b
  neutral_composite_sum: '0'
  S_grav_even: top-hat * tanh(w/ell) * [1,1,0], even under Sigma plus w-reflection
  grav_even_overlap: '0'
  S_orth_overlap: '0'
  source_dims:
    rho_a:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - 0
      - -3
      - 0
      - 0
      - 0
      - 0
      string: L^-3
    rho_b:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - 0
      - -1
      - 0
      - 0
      - 0
      - 0
      string: L^-1
    K_w_eta:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - 1
      - -2
      - -2
      - 0
      - 0
      - 0
      string: E L^-2 Chi^-2
    K_parallel_eta:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - 1
      - -2
      - -2
      - 0
      - 0
      - 0
      string: E L^-2 Chi^-2
    M2_eta:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - 1
      - -4
      - -2
      - 0
      - 0
      - 0
      string: E L^-4 Chi^-2
    S_eta:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - 1
      - -4
      - -1
      - 0
      - 0
      - 0
      string: E L^-4 Chi^-1
    G_eta_eta:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - -1
      - 0
      - 2
      - 0
      - 0
      - 0
      string: E^-1 Chi^2
    Q_E_u_eta:
      basis:
      - E
      - L
      - Chi
      - N
      - Tau
      - Q
      powers:
      - 1
      - 0
      - -1
      - 0
      - 0
      - 0
      string: E Chi^-1
green_function:
  construction: G(R,w,w')=sum_n f_n(w) f_n(w') g_n(R)/N_n; p uses the solved normalizable n=0 factor
  static_zero_mode_kernel_eta_eta: 3/(32*pi*R*ell*cosh(w/ell)**2*cosh(wp/ell)**2)
  static_shape_mode_kernel_eta_eta: 3*exp(-sqrt(3)*R/ell)*tanh(w/ell)*tanh(wp/ell)*sech(w/ell)*sech(wp/ell)/(16*pi*R*ell)
  static_relative_mode_kernel_eta_eta: 3*exp(-sqrt(2)*R*sqrt(lamN))*sech(wp/ell)**2/(32*pi*R*ell*cosh(w/ell)**2)
  static_bound_mode_sum_eta_eta: 3*(exp(sqrt(2)*R*sqrt(lamN))*exp(sqrt(3)*R/ell) + 2*exp(sqrt(2)*R*sqrt(lamN))*sinh(w/ell)*sinh(wp/ell) + exp(sqrt(3)*R/ell))*exp(-sqrt(2)*R*sqrt(lamN))*exp(-sqrt(3)*R/ell)/(32*pi*R*ell*cosh(w/ell)**2*cosh(wp/ell)**2)
  static_projected_U_kernel: 3*QE**2*ell*tanh(b/ell)**2/(8*pi*R*b**2)
  dynamic_projected_U_kernel: 3*QE**2*ell*exp(I*R*omega/cE)*tanh(b/ell)**2/(8*pi*R*b**2)
  static_trace:
    route: static_zero_mode_from_transverse_projection
    transverse_mode: translation_goldstone
    seed_m_squared: '0'
    seed_normalization: 8/(3*ell)
    operator: g''+(2/R)g'-m_0^2*g=0
    dsolve_general: (C1*R + C2)/R
    boundary_selection: constant branch removed by decay at infinity; delta normalization fixes the remaining branch coefficient
    radial_green: 1/(4*pi*R)
    flow_from_gradient: 1/(4*pi*R**2)
    flow_exponent_p: '2'
    residual: '0'
    source_hash: 3803319d4308dbbec31305f0b384e8e491e0dd8ead374571c68faf11fd86d47a
    trace_id: 4d886f2e1f6c7c4bf3997743ce138aa054667505868668cd02d265f6d5180bf3
  dynamic_trace:
    route: finite_omega_zero_mode_from_transverse_projection
    transverse_mode: translation_goldstone
    seed_m_squared: '0'
    seed_normalization: 8/(3*ell)
    operator: g''+(2/R)g'+((omega/c_E)^2-m_0^2)*g=0
    dsolve_general: sqrt(2)*sqrt(cE)*(C1*sin(R*omega/cE) - C2*cos(R*omega/cE))/(sqrt(pi)*R*sqrt(omega))
    boundary_selection: outgoing Hankel/spherical branch selected from the dsolve Bessel basis before omega->0
    radial_green_finite_omega: exp(I*R*omega/cE)/(4*pi*R)
    omega_to_0_limit: 1/(4*pi*R)
    flow_from_gradient_after_limit: 1/(4*pi*R**2)
    flow_exponent_p: '2'
    residual: '0'
    source_hash: 2a5aade44b9fde5f820a0714b9cc9f179d20fe4385d131fdb5b86f9fb1409547
    trace_id: e23b69d2a56782839090ff6528af8a66dc13e140a23dee6a7a7b1bdff382f892
  shape_trace:
    route: static_massive_mode_from_transverse_projection
    label: Shape
    seed_m_squared: 3/ell**2
    operator: g''+(2/R)g'-m_n^2*g=0
    dsolve_general: -sqrt(2)*3**(3/4)*I*I**(3/2)*sqrt(ell)*(C1*sinh(sqrt(3)*R/ell) + I*C2*cosh(sqrt(3)*R/ell))/(3*sqrt(pi)*R)
    selected_decaying_green: exp(-sqrt(3)*R/ell)/(4*pi*R)
    residual: '0'
  relative_trace:
    route: static_massive_mode_from_transverse_projection
    label: RelativeLock
    seed_m_squared: 2*lamN
    operator: g''+(2/R)g'-m_n^2*g=0
    dsolve_general: -2**(1/4)*I*I**(3/2)*(C1*sinh(sqrt(2)*R*sqrt(lamN)) + I*C2*cosh(sqrt(2)*R*sqrt(lamN)))/(sqrt(pi)*R*lamN**(1/4))
    selected_decaying_green: exp(-sqrt(2)*R*sqrt(lamN))/(4*pi*R)
    residual: '0'
  massive_terms: shape/relative/tau channels are Yukawa and exponentially suppressed at R>>ell
