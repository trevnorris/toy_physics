    headline: FAIL_DELOCALIZED_BULK_1_OVER_R3
    ablation: noncompact_anti_localizing_operator_exp_2kw_w_K_parallel_with_kw=3/ell
    k_w: 3/ell
    asymptotic_norm_exponent: 2/ell
    zero_mode_norm_cutoff: 2*(Y**4 + 8*Y**3 + 42*Y**2 + 96*Y*log(1 - Y) - 99*Y - 96*log(1 - Y))/(3*ell*(Y - 1))
    zero_mode_norm: oo
    continuum_green: 1/(4*pi*R**2)
    computed_p: 3
  FAIL_NO_MONOPOLE:
    status: FIRED
    headline: FAIL_NO_MONOPOLE
    ablation: S_orth=S-f0<f0,S>/<f0,f0>
    charge_part: 2*QE*tanh(b/ell)/b
    subtraction_part: 2*QE*tanh(b/ell)/b
    q_eff: '0'
    coulomb_term: '0'
  FAIL_GHOST_INSTABILITY:
    status: FIRED
    headline: FAIL_GHOST_INSTABILITY
    ablation: flip_source_overlapping_K_parallel_diagonal_signs
    ghost_norm: -8/(3*ell)
    G0_sign: -1
    U_pp: -3*QE**2*ell*tanh(b/ell)**2/(8*pi*R*b**2)
    U_pm: 3*QE**2*ell*tanh(b/ell)**2/(8*pi*R*b**2)
    classifier_input:
      U_pp_sign: -1
      U_pm_sign: 1
  FAIL_GRAVITY_MIXING:
    status: FIRED
    headline: FAIL_GRAVITY_MIXING
    ablation: S_mass=S_grav_even+epsMix*S_charge_plus
    pure_even_density_y: QE*y/b
    pure_even_overlap: '0'
    mixed_overlap: 2*QE*epsMix*tanh(b/ell)/b
    classifier_input: gravity_mixes_with_h
