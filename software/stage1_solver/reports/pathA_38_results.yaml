    status: FIRED
    headline: FAIL_YUKAWA
    ablation: source_only_relative_tilt_u_E=e_tau
    m_src_squared: lamTau
    tail: exp(-R*sqrt(lamTau))/(4*pi*R)
    classifier_input:
      source_m_squared: lamTau
      source_zero_mode_overlap: '0'
      source_mode_overlap: '1'
      source_mode_residual:
      - - '0'
      - - '0'
      - - '0'
      derived_tail: yukawa
  FAIL_PINNED_BRANON:
    status: FIRED
    headline: FAIL_PINNED_BRANON
    ablation: add_pathA35_style_V_conf_curvature
    m_desc_Z2_squared: '0'
    pinning_numerator: 8*Omega35**2/(3*ell)
    Omega_w_35_squared: Omega35**2
    m_desc_conf_squared: Omega35**2
