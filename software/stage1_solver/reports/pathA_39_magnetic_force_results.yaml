sectors:
  transverse:
    field: u_T
    lagrangian: 1/2 rho_br dot(u_T)^2 - 1/2 mu_R (curl u_T)^2
    source: j_T=q_A^T V, q_A^T=Nu*aT*s
    operator_static_projector_eigenvalue: k2*muR
    propagator_static_from_inversion: 1/(k2*muR)
    realspace_kernel_source: inverse Fourier of (delta_ij-k_i k_j/k^2)/k^2
    energy_sign: negative exchange energy for stable mu_R>0
  longitudinal:
    field: u_L
    lagrangian: 1/2 rho_br dot(u_L)^2 - 1/2 B_eff (div u_L)^2
    source: j_L=q_L V, q_L=Nu*aL*s
    operator_static_projector_eigenvalue: k2*rhoB0**2/chiC
    propagator_static_from_inversion: chiC/(k2*rhoB0**2)
    realspace_kernel_source: inverse Fourier of (k_i k_j/k^2)/k^2
    energy_sign: negative exchange energy for stable B_eff>0
derivation:
  operator_inversion:
    O_T_static_scalar: k2*muR
    O_L_static_scalar: k2*rhoB0**2/chiC
    G_T_static_coeff: 1/(k2*muR)
    G_L_static_coeff: chiC/(k2*rhoB0**2)
  inverse_fourier_identities:
    scalar_green_kminus2: 1/(4*pi*R)
    biharmonic_seed_kminus4: -R/(8*pi)
    kk_over_k4_contract: -(Aprod - Ddot)/(8*pi*R)
    scalar_green_kminus4: -R/(8*pi)
    polyharmonic_seed_kminus6: R**3/(96*pi)
  exchange_integral: U_12=-int d^3k/(2*pi)^3 j1(-k).G(k).j2(k)
  green_tensor_consistency: the derived Green tensor is reinserted into the static EOM as a consistency residual; no independent
    second-derivation claim is made
kernel:
  definitions:
    R: X2-X1, R=|R|, n=R/R
    D: V1.V2
    a: V1.n
    b: V2.n
    A: (V1.n)*(V2.n)
    qA_i: s_i*Nu*aT
    qL_i: s_i*Nu*aL
  compact:
    K_T: (D + A)/(8*pi*R)
    K_L: (D - A)/(8*pi*R)
    U_12: -s1*s2*Nu^2/(8*pi*R)*[aT^2*(D+A)/mu_R + aL^2*(D-A)/B_eff]
    B_eff_substituted: -s1*s2*Nu^2/(8*pi*R)*[aT^2*(D+A)/mu_R + aL^2*chi_c*(D-A)/rho_B0^2]
    F_12: -grad_R U_12, derived symbolically from the computed U_12
  K_T: (Aprod + Ddot)/(8*pi*R)
  K_L: -(Aprod - Ddot)/(8*pi*R)
  K_T_perturbed_kminus4: R*(Aprod - 3*Ddot)/(32*pi)
  K_L_perturbed_kminus4: -R*(Aprod + Ddot)/(32*pi)
  U_T_integrate_out: -Nu**2*aT**2*s1*s2*(Aprod + Ddot)/(8*pi*R*muR)
  U_L_integrate_out: Nu**2*aL**2*chiC*s1*s2*(Aprod - Ddot)/(8*pi*R*rhoB0**2)
  U_total: Nu**2*s1*s2*(Aprod*aL**2*chiC*muR - Aprod*aT**2*rhoB0**2 - Ddot*aL**2*chiC*muR - Ddot*aT**2*rhoB0**2)/(8*pi*R*muR*rhoB0**2)
  U_eom_green_solve: Nu**2*s1*s2*(Aprod*aL**2*chiC*muR - Aprod*aT**2*rhoB0**2 - Ddot*aL**2*chiC*muR - Ddot*aT**2*rhoB0**2)/(8*pi*R*muR*rhoB0**2)
  eom_minus_integrate: '0'
  U_wrong_falloff_rederived: Nu**2*R*s1*s2*(Aprod*aL**2*chiC*muR - Aprod*aT**2*rhoB0**2 + Ddot*aL**2*chiC*muR + 3*Ddot*aT**2*rhoB0**2)/(32*pi*muR*rhoB0**2)
  F_12:
  - - Nu**2*s1*s2*(-aL**2*chiC*muR*(-3*Aprod*nx + Ddot*nx + arad*v2x + brad*v1x) + aT**2*rhoB0**2*(-3*Aprod*nx - Ddot*nx +
      arad*v2x + brad*v1x))/(8*pi*R**2*muR*rhoB0**2)
  - - Nu**2*s1*s2*(-aL**2*chiC*muR*(-3*Aprod*ny + Ddot*ny + arad*v2y + brad*v1y) + aT**2*rhoB0**2*(-3*Aprod*ny - Ddot*ny +
      arad*v2y + brad*v1y))/(8*pi*R**2*muR*rhoB0**2)
  - - Nu**2*s1*s2*(-aL**2*chiC*muR*(-3*Aprod*nz + Ddot*nz + arad*v2z + brad*v1z) + aT**2*rhoB0**2*(-3*Aprod*nz - Ddot*nz +
      arad*v2z + brad*v1z))/(8*pi*R**2*muR*rhoB0**2)
  F_wrong_falloff_rederived:
  - - Nu**2*s1*s2*(Aprod*aL**2*chiC*muR*nx - Aprod*aT**2*nx*rhoB0**2 - Ddot*aL**2*chiC*muR*nx - 3*Ddot*aT**2*nx*rhoB0**2 -
      aL**2*arad*chiC*muR*v2x - aL**2*brad*chiC*muR*v1x + aT**2*arad*rhoB0**2*v2x + aT**2*brad*rhoB0**2*v1x)/(32*pi*muR*rhoB0**2)
  - - Nu**2*s1*s2*(Aprod*aL**2*chiC*muR*ny - Aprod*aT**2*ny*rhoB0**2 - Ddot*aL**2*chiC*muR*ny - 3*Ddot*aT**2*ny*rhoB0**2 -
      aL**2*arad*chiC*muR*v2y - aL**2*brad*chiC*muR*v1y + aT**2*arad*rhoB0**2*v2y + aT**2*brad*rhoB0**2*v1y)/(32*pi*muR*rhoB0**2)
  - - Nu**2*s1*s2*(Aprod*aL**2*chiC*muR*nz - Aprod*aT**2*nz*rhoB0**2 - Ddot*aL**2*chiC*muR*nz - 3*Ddot*aT**2*nz*rhoB0**2 -
      aL**2*arad*chiC*muR*v2z - aL**2*brad*chiC*muR*v1z + aT**2*arad*rhoB0**2*v2z + aT**2*brad*rhoB0**2*v1z)/(32*pi*muR*rhoB0**2)
  falloff:
    potential: R^-1
    point_force: R^-2
    brane_localized: true
    classification: &id001
      verdict: MAGNETIC_FORCE_DERIVED
      verdict_code: 1
