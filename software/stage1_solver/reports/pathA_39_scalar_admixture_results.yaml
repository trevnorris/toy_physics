  engine_agreement: ENGINE_AGREE
  robust_floor_verdict: FAIL_EXTRA_H_BRANON
  decisive_density_residue: Nu**2*aL**2*sCharge**2/rhoBr
  decisive_h_residue: 4*QE**2*tanh(b/ell)**2/(Mh*b**2)
engine_agreement:
  status: ENGINE_AGREE
  compared_payload:
    top_line_verdict: FAIL_OBSERVABLE_SCALAR_ADMIXTURE
    main_verdict_code: 5
    control_verdicts:
      inject_qL_epsilon: FAIL_OBSERVABLE_SCALAR_ADMIXTURE
      closed_steady_current_wire_limit: WIRE_LIMIT_NO_LONGITUDINAL_RESPONSE
      B_eff_positive_vs_zero: FAIL_OBSERVABLE_SCALAR_ADMIXTURE->FAIL_EXTRA_H_BRANON
      Mh_positive_qh_nonzero: FAIL_EXTRA_H_BRANON
      cE_import_match: IMPORT_MATCH
      mixing_on_with_derived_qL_zero: FAIL_OBSERVABLE_SCALAR_ADMIXTURE
    self_tests: &id001
      FAIL_OBSERVABLE_SCALAR_ADMIXTURE: FAIL_OBSERVABLE_SCALAR_ADMIXTURE
      FAIL_EXTRA_H_BRANON: FAIL_EXTRA_H_BRANON
      FAIL_CHARGE_COUPLED_CS_SCALAR: FAIL_CHARGE_COUPLED_CS_SCALAR
      PASS_BY_DECLARATION: PASS_BY_DECLARATION
      SCALAR_COEXISTENCE_CLEAN: SCALAR_COEXISTENCE_CLEAN
    checked_expression_count: 41
    expr_digest: d4ac85aac565ab8d7bc80b7c1180d0e90cabc32c0ddd8e0ebfd1ca26c6c5e24a
  sympy_payload: /var/projects/toy_physics/software/stage1_solver/_scratch/pathA_39_scalar_admixture_screen_sympy.json
  mathematica_payload: /var/projects/toy_physics/software/stage1_solver/_scratch/pathA_39_scalar_admixture_screen_mathematica.json
imports:
  checks:
    pathA_36_B_eff:
      expected: rho_B0**2/chi_c
      actual: rho_B0**2/chi_c
      match: true
    pathA_36_c_gamma_squared:
      expected: mu_R/rho_br
      actual: mu_R/rho_br
      match: true
    pathA_38_q_h_plus:
      expected: 2*QE*tanh(b/ell)/b
      actual: 2*QE*tanh(b/ell)/b
      match: true
    pathA_38_dynamic_green_speed:
      expected: exp(I*R*omega/cE)/(4*pi*R)
      actual: exp(I*R*omega/cE)/(4*pi*R)
      match: true
  guard_ablations:
    pathA_38_dynamic_green_wrong_c_gamma:
      expected: exp(I*R*omega/c_gamma)/(4*pi*R)
      actual: exp(I*R*omega/cE)/(4*pi*R)
      match: false
  imported:
    B_eff: rho_B0^2/chi_c
    c_gamma_squared: mu_R/rho_br
    q_h: 2*QE*tanh(b/ell)/b
    c_E: cE from pathA_38 dynamic Green exp(I*R*omega/cE)/(4*pi*R)
    f_h:
    - - 1/(ell*cosh(w/ell)**2)
    - - 1/(ell*cosh(w/ell)**2)
    - - '0'
    f_u: pathA_36 shear profile f_u(w); normalization kept as Nu because the report does not give a closed profile
    M_h: positive imported property from pathA_38; coefficient kept as symbolic Mh>0
  declared_vs_imported:
    imported_exact:
    - B_eff=rho_B0^2/chi_c
    - c_gamma^2=mu_R/rho_br
    - q_h=2*QE*tanh(b/ell)/b
    - c_E=cE
    imported_positivity_parameterized:
    - M_h>0 as symbolic Mh
    - f_u normalization Nu
    declared_scan_parameters:
    - q_L from Stage-1 ansatz coefficient aL
    - C_hu scalar mixing
    sim_deferred_values:
    - aT
    - aL
    - bulk compactness
    - operator motion perturbation deltaO_V
L_scalar:
  fields:
  - u_L
  - h
  Fourier_x: x=omega^2/k^2
  density_block: 1/2 rhoBr dot(u_L)^2 - 1/2 B_eff k^2 u_L^2, B_eff=rhoB0^2/chiC
  h_block: 1/2 Mh dot(h)^2 - 1/2 Kh k^2 h^2, Kh=Mh*cE^2
  mixing: -Chu k^2 u_L h
  source_charge_vector: '[q_L, q_h]'
  source_mass_vector: '[qM, 0]'
  D_x:
  - - rhoBr*x - rhoB0**2/chiC
    - -Chu
  - - -Chu
    - -Mh*cE**2 + Mh*x
  detD: (-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)/chiC
  G_scalar_x:
  - - chiC*(-Mh*cE**2 + Mh*x)/(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)
    - Chu*chiC/(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)
  - - Chu*chiC/(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)
    - chiC*(rhoBr*x - rhoB0**2/chiC)/(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)
  G_scalar_omega: G_scalar_x/k^2
  A_qq: (4*Chu*QE*b*chiC*qL*tanh(b/ell) - Mh*b**2*cE**2*chiC*qL**2 + Mh*b**2*chiC*qL**2*x + 4*QE**2*chiC*rhoBr*x*tanh(b/ell)**2
    - 4*QE**2*rhoB0**2*tanh(b/ell)**2)/(b**2*(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2
    - Mh*rhoB0**2*x))
  A_qm: chiC*qM*(2*Chu*QE*tanh(b/ell) - Mh*b*cE**2*qL + Mh*b*qL*x)/(b*(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2
    + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x))
  A_mm: Mh*chiC*qM**2*(-cE**2 + x)/(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)
decisive_residue_table_scope: C_hu -> 0 decoupled limit
mixed_eigenpole_residue_pointer: poles_generic_mixing
poles_generic_mixing:
- label: root_minus
  speed_squared: (-sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4)
    + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)/(2*Mh*chiC*rhoBr)
  residue_to_charge: -(4*Chu*QE*b*chiC*qL*tanh(b/ell) - Mh*b**2*cE**2*chiC*qL**2 - 4*QE**2*rhoB0**2*tanh(b/ell)**2 + b**2*qL**2*(-sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr
    + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4) + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)/(2*rhoBr)
    + 2*QE**2*(-sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4)
    + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)*tanh(b/ell)**2/Mh)/(sqrt(Mh)*b**2*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2
    - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4))
  residue_to_mass: -sqrt(Mh)*chiC*qM**2*(-cE**2 + (-sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr
    + Mh*rhoB0**4) + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)/(2*Mh*chiC*rhoBr))/sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2
    - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4)
- label: root_plus
  speed_squared: (sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4)
    + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)/(2*Mh*chiC*rhoBr)
  residue_to_charge: (4*Chu*QE*b*chiC*qL*tanh(b/ell) - Mh*b**2*cE**2*chiC*qL**2 - 4*QE**2*rhoB0**2*tanh(b/ell)**2 + b**2*qL**2*(sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr
    + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4) + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)/(2*rhoBr)
    + 2*QE**2*(sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4)
    + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)*tanh(b/ell)**2/Mh)/(sqrt(Mh)*b**2*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2
    - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4))
  residue_to_mass: sqrt(Mh)*chiC*qM**2*(-cE**2 + (sqrt(Mh)*sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2 - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr
    + Mh*rhoB0**4) + Mh*cE**2*chiC*rhoBr + Mh*rhoB0**2)/(2*Mh*chiC*rhoBr))/sqrt(4*Chu**2*chiC**2*rhoBr + Mh*cE**4*chiC**2*rhoBr**2
    - 2*Mh*cE**2*chiC*rhoB0**2*rhoBr + Mh*rhoB0**4)
robust_floor:
  verdict: FAIL_EXTRA_H_BRANON
  channel: h_branon
  residue_to_charge: 4*QE**2*tanh(b/ell)**2/(Mh*b**2)
  import_forced: true
  import_forced_inputs:
