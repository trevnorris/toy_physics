  Pi_L: k_i k_j/k^2
  q_A_T: Nu*aT*sCharge
  q_L: Nu*aL*sCharge
  q_bulk: aBulk*sCharge
  q_even_to_A: '0'
  anisotropy: parameterized/sim-deferred; isotropic pass requires anisotropy tensor = 0
  derivation_status: DERIVED_STAGE1_FROM_DECLARED_PARAMETERIZED_ANSATZ
  controls:
    V_equals_zero:
      q_A_T: '0'
      q_L: '0'
      status: FIRED
    charge_flip_s_to_minus_s:
      q_A_T: -q_A_T
      q_L: -q_L
      status: FIRED
    neutral_plus_minus_composite:
