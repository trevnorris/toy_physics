      first_class_count: 0
      second_class_count: 2
      longitudinal_dof: 1
    maxwell:
      classification: FIRST_CLASS_MAXWELL_CHAIN
      first_class_count: 2
      second_class_count: 0
      longitudinal_dof: 0
      generator: &id006
        generator: G[chi]=(rho_br/C_J)*(chi*Phi_2-dot(chi)*Phi_1)
        delta_u_L: k chi
        delta_theta: -(rho_br/C_J) dot(chi)
        local: true
        inverse_k_or_inverse_omega: false
