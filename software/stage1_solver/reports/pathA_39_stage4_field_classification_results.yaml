assembled_system:
  coordinates: &id002
  - u_T1
  - u_T2
  - u_L
  - h
  Q: &id003
  - - -k**2*muR + omega**2*rhoBr
    - '0'
    - '0'
    - '0'
  - - '0'
    - -k**2*muR + omega**2*rhoBr
    - '0'
    - '0'
  - - '0'
    - '0'
    - omega**2*rhoBr - k**2*rhoB0**2/chiC
    - -Chu*k**2
  - - '0'
    - '0'
    - -Chu*k**2
    - -Mh*cE**2*k**2 + Mh*omega**2
  J_charge: &id004
  - - Nu*aT*sCharge
  - - Nu*aTp*sCharge
  - - Nu*aL*sCharge
  - - 2*QE*tanh(b/ell)/b
  J_q_record: &id005
    q_A_T_components:
    - Nu*aT*sCharge
    - Nu*aTp*sCharge
    q_L: Nu*aL*sCharge
    q_h: 2*QE*tanh(b/ell)/b
    q_M: qM
    mass_source_is_not_counted_as_charge_residue: true
  R_charge: Nu**2*sCharge**2*(aT**2 + aTp**2)/(-k**2*muR + omega**2*rhoBr) + chiC*(4*Chu*Nu*QE*aL*sCharge*tanh(b/ell)/b + Nu**2*aL**2*sCharge**2*(-Mh*cE**2
    + Mh*x) + 4*QE**2*(rhoBr*x - rhoB0**2/chiC)*tanh(b/ell)**2/b**2)/(k**2*(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2
    - Mh*rhoB0**2*x))
