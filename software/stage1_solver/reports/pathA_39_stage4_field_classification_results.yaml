      residue_to_mass: chiC*qM**2*(-Mh*cE**2 + (Mh*cE**2*rhoBr + Mh*rhoB0**2/chiC - sqrt(4*Chu**2*Mh*rhoBr + (Mh*cE**2*rhoBr - Mh*rhoB0**2/chiC)**2))/(2*rhoBr))/(-Mh*cE**2*chiC*rhoBr
        - Mh*rhoB0**2 + chiC*(Mh*cE**2*rhoBr + Mh*rhoB0**2/chiC - sqrt(4*Chu**2*Mh*rhoBr + (Mh*cE**2*rhoBr - Mh*rhoB0**2/chiC)**2)))
      sector: scalar
    - label: scalar_root_plus
