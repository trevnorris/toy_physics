    det_Q: k**4*(-k**2*muR + omega**2*rhoBr)**2*(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)/chiC
    physical_det_Q: k**4*(-k**2*muR + omega**2*rhoBr)**2*(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2 - Mh*rhoB0**2*x)/chiC
    J_charge: *id004
