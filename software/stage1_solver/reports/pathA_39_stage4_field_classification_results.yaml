      residue_to_charge: chiC*(4*Chu*Nu*QE*aL*sCharge*tanh(b/ell)/b + Nu**2*aL**2*sCharge**2*(-Mh*cE**2 + (Mh*cE**2*rhoBr + Mh*rhoB0**2/chiC +
        sqrt(4*Chu**2*Mh*rhoBr + (Mh*cE**2*rhoBr - Mh*rhoB0**2/chiC)**2))/(2*rhoBr)) + 4*QE**2*(-rhoB0**2/chiC + (Mh*cE**2*rhoBr + Mh*rhoB0**2/chiC
