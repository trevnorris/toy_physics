      diagonal_stiffness_positive: true
      det_stiffness_over_k4: -Chu**2 + Mh*cE**2*rhoB0**2/chiC
      stiffness_eigenvalues:
      - k**2*(Mh*cE**2 - sqrt(4*Chu**2 + (-Mh*cE**2 + rhoB0**2/chiC)**2) + rhoB0**2/chiC)/2
      - k**2*(Mh*cE**2 + sqrt(4*Chu**2 + (-Mh*cE**2 + rhoB0**2/chiC)**2) + rhoB0**2/chiC)/2
      condition: computed det(stiffness)/k^4=-Chu**2 + Mh*cE**2*rhoB0**2/chiC is positive; with positive diagonal stiffness entries this gives
        both finite-k stiffness eigenvalues > 0
      fixture_label: stable_bound
    poles:
