    J_q_record: *id005
    R_charge: Nu**2*sCharge**2*(aT**2 + aTp**2)/(-k**2*muR + omega**2*rhoBr) + chiC*(4*Chu*Nu*QE*aL*sCharge*tanh(b/ell)/b + Nu**2*aL**2*sCharge**2*(-Mh*cE**2
      + Mh*x) + 4*QE**2*(rhoBr*x - rhoB0**2/chiC)*tanh(b/ell)**2/b**2)/(k**2*(-Chu**2*chiC - Mh*cE**2*chiC*rhoBr*x + Mh*cE**2*rhoB0**2 + Mh*chiC*rhoBr*x**2
      - Mh*rhoB0**2*x))
    constraint:
