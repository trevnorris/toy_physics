schema: pathA_40_cone_lock_results/v1
verdict: CONE_LOCK_CALIBRATED
atomic_riders: []
delta_r: 2
prepass:
  route_a:
    grade: ROUTE_A_UNDERDETERMINED_MISSING_NONLINEAR_THROAT
    candidate_bridge: true
    records:
      R1:
        status: absent
        object: nonlinear bulk/throat/interior action containing both GNLS EOS and in-plane u^a shear
        citation:
        - reports/pathA_35_G0_freeze.md:34-38
      R2:
        status: absent
        object: closed transverse profile f_u(w) for the in-plane shear mode
        citation:
        - reports/pathA_39_scalar_admixture_screen.md:45-58
      R3:
        status: absent
        object: common normalization/integral deriving both rho_br and mu_R
        citation:
        - reports/pathA_35_G0_freeze.md:83-88
      R4:
        status: absent
        object: algebraic reduction proving mu_R/rho_br = 5K rho^4/m
        citation:
        - reports/pathA_35_G0_freeze.md:83-88
      R5:
        status: not_applicable
        object: R4 reduction leaves no residual ell/thickness/profile/compactness factor
        citation:
        - reports/pathA_38_results.yaml:80; reports/pathA_38_throat_body_electric_localization.md:26-30
    missing_objects:
    - R1
    - R2
    - R3
    - R4
    - R5
    r5_gating_rule: R5 is present only after R4 is present and no residual free geometric/profile factor remains; otherwise not_applicable.
  route_b:
    status: ROUTE_B_CLOSED_CHECKED_NEGATIVE
    field_distinctness_checked: true
    over_import_guard: CHECKED_NEGATIVE
    citations:
    - reports/pathA_39_stage4_field_classification_results.yaml:1-30; reports/pathA_36_c5_phase_potential_results.yaml:441-449
    - directive/pathA_40_cone_lock.md:Route-B guard
  freedom:
    status: FREEDOM_UNCONSTRAINED
    free_params:
    - C_hu
    - rho_br
    ties: []
layer1:
  sector_sat:
    status: SAT
    method: exact_positive_witness_checked_against_polynomial_equalities_and_strict_slack
    witness:
      B_eff: '1'
      C_hu: 1/2
      K: '1'
      K_h: '9'
      M_h: '1'
      c_E: '3'
      chi_c: '4'
      m: '5'
      mu_R: '2'
      rho: '1'
      rho_B0: '2'
      rho_br: '1'
      sigma: 35/4
  cone_lock_sat:
    status: SAT
    method: exact_positive_witness_checked_against_polynomial_equalities_and_strict_slack
    witness:
      B_eff: '1'
      C_hu: 1/2
      K: '1'
      K_h: '1'
      M_h: '1'
      c_E: '1'
      chi_c: '4'
      m: '5'
      mu_R: '1'
      rho: '1'
      rho_B0: '2'
      rho_br: '1'
      sigma: 3/4
layer2:
  provenance:
    A:
      status: WITNESSED
      method: exact real non-entailment witness satisfying E and lock != 0
      remainder: -5*K*rho**4*rho_br + m*mu_R
      lock_value_at_witness: '5'
      witness:
        B_eff: '1'
        C_hu: 1/2
        K: '1'
        K_h: '9'
        M_h: '1'
        c_E: '3'
        chi_c: '4'
        m: '5'
        mu_R: '2'
        rho: '1'
        rho_B0: '2'
        rho_br: '1'
        sigma: 35/4
    B:
      status: WITNESSED
      method: exact real non-entailment witness satisfying E and lock != 0
      remainder: c_E**2*rho_br - mu_R
      lock_value_at_witness: '7'
      witness:
        B_eff: '1'
        C_hu: 1/2
        K: '1'
        K_h: '9'
        M_h: '1'
        c_E: '3'
        chi_c: '4'
        m: '5'
        mu_R: '2'
        rho: '1'
        rho_B0: '2'
        rho_br: '1'
        sigma: 35/4
  dimension:
    status: CERTIFIED
    delta_r: 2
    dim_before: 10
    dim_after: 8
    before:
      dimension: 10
      leading_supports:
      - - M_h
        - c_E
      - - rho_B0
      - - C_hu
      max_independent_coordinate_set:
      - rho
      - rho_br
      - chi_c
      - mu_R
      - K
      - m
      - M_h
      - K_h
      - B_eff
      - sigma
      method: Groebner initial-monomial Hilbert/Krull dimension; real-locus guarded by exact positive witness
    after:
      dimension: 8
      leading_supports:
      - - rho
        - rho_br
        - K
      - - rho
        - mu_R
        - K
      - - rho_br
        - c_E
      - - M_h
        - c_E
      - - rho_B0
      - - mu_R
        - M_h
      - - C_hu
      max_independent_coordinate_set:
      - rho
      - rho_br
      - chi_c
      - mu_R
      - m
      - K_h
      - B_eff
      - sigma
      method: Groebner initial-monomial Hilbert/Krull dimension; real-locus guarded by exact positive witness
    real_locus_guard: Both before/after formulas have exact positive witnesses satisfying the strict stability slack; the positive cell is an
      open semialgebraic subset of the computed variety.
    dropped_assumptions_named:
    - regular-sequence/generic-Jacobian-rank
    - complex-only radical/dimension without real-locus guard
field_overlay:
  field_content: FIELD_SCALAR_VECTOR_DEPARTURE
  field_content_source: reports/pathA_39_stage4_field_classification_results.yaml:1-30
  determinant: B_eff*K_h*k**4 - B_eff*M_h*k**2*omega**2 - C_hu**2*k**4 - K_h*k**2*omega**2*rho_br + M_h*omega**4*rho_br
  det_on_light_cone_under_B: -C_hu**2*k**4
  root_selection_rule: v_minus^2 uses the negative square-root branch and is the lower mixed scalar speed because rho_br,M_h>0; v_plus^2 uses
    the positive branch.
  v_squared_minus: (B_eff*M_h + K_h*rho_br - sqrt(B_eff**2*M_h**2 - 2*B_eff*K_h*M_h*rho_br + 4*C_hu**2*M_h*rho_br + K_h**2*rho_br**2))/(2*M_h*rho_br)
  v_squared_plus: (B_eff*M_h + K_h*rho_br + sqrt(B_eff**2*M_h**2 - 2*B_eff*K_h*M_h*rho_br + 4*C_hu**2*M_h*rho_br + K_h**2*rho_br**2))/(2*M_h*rho_br)
  Delta_pole_minus: (B_eff*M_h + K_h*rho_br - 2*M_h*mu_R - sqrt(B_eff**2*M_h**2 - 2*B_eff*K_h*M_h*rho_br + 4*C_hu**2*M_h*rho_br + K_h**2*rho_br**2))/(2*M_h*rho_br)
  Delta_pole_plus: (B_eff*M_h + K_h*rho_br - 2*M_h*mu_R + sqrt(B_eff**2*M_h**2 - 2*B_eff*K_h*M_h*rho_br + 4*C_hu**2*M_h*rho_br + K_h**2*rho_br**2))/(2*M_h*rho_br)
  Delta_pole_minus_under_B: (B_eff*M_h - K_h*rho_br - sqrt(B_eff**2*M_h**2 - 2*B_eff*K_h*M_h*rho_br + 4*C_hu**2*M_h*rho_br + K_h**2*rho_br**2))/(2*M_h*rho_br)
  Delta_pole_plus_under_B: (B_eff*M_h - K_h*rho_br + sqrt(B_eff**2*M_h**2 - 2*B_eff*K_h*M_h*rho_br + 4*C_hu**2*M_h*rho_br + K_h**2*rho_br**2))/(2*M_h*rho_br)
  status: OFF_CONE_under_AB_proportional_to_C_hu_squared_OPEN_110
