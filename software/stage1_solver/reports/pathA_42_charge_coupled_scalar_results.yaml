ep_adjudication:
  h_EP_mass_channel: EARNED_SAFE_MASS_CHANNEL_ON_DECOUPLED_FLOOR
  full_decoupled_floor_EP_safety: NOT_EARNED
  required_conjunction: EARNED_SAFE_MASS_CHANNEL_ON_DECOUPLED_FLOOR AND universality=EARNED_SAFE
  mixing_caveat: C_hu*q_h*q_M term reintroduces a mass coupling when mixing is nonzero.
  unqualified_decoupled_floor_EP_safe_reported: false
static_exchange_matrix:
  provenance: dual-engine derivation
  stiffness_matrix: '[[B_eff, C_hu], [C_hu, K_h]]'
  determinant: B_eff*K_h - C_hu**2
  A_qq: (B_eff*q_h**2 - 2*C_hu*q_L*q_h + K_h*q_L**2)/(B_eff*K_h - C_hu**2)
  A_qm: (B_eff*m_h*q_h - C_hu*m_h*q_L - C_hu*q_M*q_h + K_h*q_L*q_M)/(B_eff*K_h - C_hu**2)
  A_mm: (B_eff*m_h**2 - 2*C_hu*m_h*q_M + K_h*q_M**2)/(B_eff*K_h - C_hu**2)
  decoupled_projection:
    A_qm_with_C_hu_0_and_h_mass_residue_0: q_L*q_M/B_eff
    mass_residue_zero_projection: true
  mixed_projection:
    q_L_0_C_hu_nonzero_q_M_nonzero: -C_hu*q_M*q_h/(B_eff*K_h - C_hu**2)
    MIXED_SCALAR_EP_RISK: true
radiation_adjudication:
  provenance: dual-engine dipole/flux exponent derivation
  setup: nonrelativistic point-charge dipole; scalar and EM far-zone fields at c_E/c_gamma; scalar flux vs Poynting flux
  current_ledger_branch: exponent-3 bare-fixed/current branch
  current_ledger_state: SIM_GATED
  scalar_power_from_flux: d**2*omega**4*q_h**2/(M_h*c_E**3)
  em_power_from_flux: Q_E**2*d**2*omega**4/c_gamma**3
  bare_flux_ratio: c_gamma**3*q_h**2/(M_h*Q_E**2*c_E**3)
  corrupt_speed_flux_ratio: c_gamma**3*q_h**2/(M_h*Q_E**2*c_E)
  wrong_normalization_ratio: c_gamma**3*kappa/(Q_E**2*c_E)
  bare_fixed_exponent: 3
  pinned_K_h_conditional_exponent: 1
  pinned_K_h_test_default: false
  same_cE_cgamma_without_pinned_Kh: SIM_GATED
  same_cE_cgamma_with_pinned_Kh: FALSIFIABLE_TENSION
  magnitude: SIM_GATED_BY_GUARD_A_NO_NUMERIC_POWER_RATIO_EMITTED
  cherenkov_subtag_spelling_guard: CHERENKOV_DEFERRED
  subtags:
  - CHERENKOV_DEFERRED
preferred_frame:
  state: SIM_GATED
  cost: Large c_E/c_gamma radiation hiding would trigger PREFERRED_FRAME_TENSION.
  source: software/stage1_solver/reports/pathA_39_magnetic_force.md:63-65
u_L_and_mixing_structure:
